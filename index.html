/* ---- Dashboard helpers ---- */
function _pndFormatDateShort(iso){
  if(!iso) return '';
  var d = new Date(iso+'T00:00:00');
  var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return mo+' '+d.getDate()+', '+d.getFullYear();
}

/* Read this-week's huddle status for a person. Returns 'complete', 'in-progress',
   'not-started', or 'away'. Complete = every row answered; in-progress = at least
   one row answered but not all; away = week marked Away; not-started = no data. */
function _pndHuddleStatusThisWeek(personId, weekIso){
  var std = standardFor(personById(personId));
  if(!std) return 'no-std';
  if(std.rotates){
    /* Rotating role: use the phase active for this week */
    var phase = activePhaseFor(personById(personId), weekIso);
    std = ROLE_STANDARDS[personById(personId).roleLabel].weeks[phase-1].items;
  }
  var m = _pndLoadHuddles ? _pndLoadHuddles() : {};
  var key = personId+'__'+weekIso;
  var rec = m[key];
  if(!rec) return 'not-started';
  if(rec.away) return 'away';
  var answers = rec.answers || {};
  var answered = std.filter(function(r){ return answers[r.id]==='yes' || answers[r.id]==='no'; }).length;
  if(answered === 0) return 'not-started';
  if(answered < std.length) return 'in-progress';
  return 'complete';
}
/* Last N weeks' scores for a person for the mini-trend widget. Returns array of
   {iso, pct, away} newest-last. */
function _pndLastNScores(personId, weekIso, n){
  var out = [];
  var d = new Date(weekIso+'T00:00:00');
  d.setDate(d.getDate() - (n-1)*7);
  var m = _pndLoadHuddles ? _pndLoadHuddles() : {};
  var person = personById(personId);
  for(var i=0; i<n; i++){
    var iso = isoDate(d);
    var key = personId+'__'+iso;
    var rec = m[key];
    var std = standardFor(person);
    if(std && std.rotates){
      var phase = activePhaseFor(person, iso);
      std = ROLE_STANDARDS[person.roleLabel].weeks[phase-1].items;
    }
    if(!isWeekTracked(personId, iso)){ out.push({iso:iso, pct:null, away:false, hardFail:false, untracked:true}); }
    else if(!rec || !std){ out.push({iso:iso, pct:null, away:false, hardFail:false}); }
    else if(rec.away){ out.push({iso:iso, pct:null, away:true, hardFail:false}); }
    else {
      var yes=0, total=std.length, hard=false;
      std.forEach(function(row){
        var v = (rec.answers||{})[row.id];
        if(v==='yes') yes++;
        else if(row.hard) hard = true;
      });
      var pct = hard ? 0 : Math.round((yes/total)*100);
      out.push({iso:iso, pct:pct, away:false, hardFail:hard});
    }
    d.setDate(d.getDate()+7);
  }
  return out;
}

/* Supervisor / Admin dashboard: team roll-up. */
function _pndDashboardSupervisor(cu, visiblePeople, thisMonday, isAdmin){
  var h = '';
  /* Filter to direct reports for this-week's huddle grid.
     For an admin (no team direction), just show every visible person with a scorecard. */
  var reports = visiblePeople.filter(function(p){
    if(cu && p.id===cu.id) return false;                     /* skip self */
    var std = standardFor(p); return !!std;                   /* skip roles with no scorecard */
  });

  /* Section: This week's huddles - honors per-role meeting cadence. On an off-week
     (biweekly/monthly role whose meeting is not scheduled this week), the card shows
     "Not due this week" instead of nagging with "Not started". */
  h += '<div class="dash-card"><div class="dash-card-hd"><h2 class="dash-t">This week\'s huddles</h2><span class="dash-m">Click a person to open their weekly huddle</span></div><div class="dash-card-bd">';
  if(!reports.length){
    h += '<div class="empty" style="padding:20px">No direct reports with a weekly scorecard in your scope.</div>';
  } else {
    h += '<div class="dash-grid">';
    reports.forEach(function(p){
      var isDue = isHuddleWeek(p, thisMonday);
      var st = _pndHuddleStatusThisWeek(p.id, thisMonday);
      /* The current week can never be locked (it closes the following Monday),
         so the actionable lock signal is the week that just closed: flag anyone
         whose last week locked without being finished. */
      var _lwIso = addDays(thisMonday, -7);
      var _lwSt = _pndHuddleStatusThisWeek(p.id, _lwIso);
      /* Scorecard completion is weekly for EVERY role - meeting cadence only
         governs the huddle meeting, not the scorecard. So an off-week that
         locked incomplete still counts as missed. */
      var _lwMissed = isWeekTracked(p.id, _lwIso) && isWeekLocked(p.id, _lwIso) && _lwSt !== 'complete' && _lwSt !== 'away' && _lwSt !== 'no-std';
      var pillCls, pillLbl;
      if(!isDue){
        pillCls = 'c-gry'; pillLbl = 'Not due this week';
      } else {
        pillCls = st==='complete'?'c-grn':st==='in-progress'?'c-amb':st==='away'?'c-blu':'c-gry';
        pillLbl = st==='complete'?'Complete':st==='in-progress'?'In progress':st==='away'?'Away':'Not started';
      }

      var cadTag = cad!=='weekly' ? '<span class="dash-person-cad">'+cadenceLabel(cad)+'</span>' : '';
      h += '<button type="button" class="dash-person-btn'+(!isDue?' dash-person-offweek':'')+'" onclick="pndOpenPersonHuddle(\''+p.id+'\',\''+thisMonday+'\')">'+
             '<div class="dash-person-avatar" style="background:'+_personBg(p)+'">'+esc(p.initials||'')+'</div>'+
             '<div class="dash-person-body"><div class="dash-person-name">'+esc(fullName(p))+cadTag+'</div>'+

             (_lwMissed ? '<div class="dash-person-missed">&#9888; Last week locked incomplete</div>' : '')+
             '</div>'+
             '<span class="chip '+pillCls+'">'+esc(pillLbl)+'</span>'+
           '</button>';
    });
    h += '</div>';
  }
  h += '</div></div>';

  /* Section: 4-week weekly score trend - VSP KPI-card treatment.
     One card per person: big latest-score number, status chip, WoW delta arrow,
     4-week sparkline. No-data people get a muted card with a start-huddle CTA
     so the empty state is actionable rather than dead. */
  h += '<div class="dash-card"><div class="dash-card-hd"><h2 class="dash-t">Weekly Scorecard - 4-week trend</h2><span class="dash-m">Scorecard percentage per person. Anyone below 80% or trending down needs attention</span></div><div class="dash-card-bd">';

      var chipCls = latest>=90?'c-grn':latest>=80?'c-amb':'c-red';

/* Review status for a person's quarterly or annual: complete (archived),
   in progress (signatures started), or not started - now schedule-aware.
   If a review date is set and has passed without completion, the chip goes
   red Overdue with the missed date. Returns { cls, lbl }. */
function _pndReviewStatus(person, kind){
  var now = new Date();
  var todayIso = isoDate(now);
  function withSchedule(base, period){
    var rd = getReviewDate(person.id, kind, period);
    if(!rd || !rd.date) return base;
    if(base.cls === 'c-grn') return base;                       /* complete - schedule no longer matters */
    if(rd.date < todayIso){
      return { cls:'c-red', lbl:'Overdue - was '+_pndFormatDateShort(rd.date) };
    }
    return { cls: base.cls, lbl: base.lbl+' - '+_pndFormatDateShort(rd.date) };
  }
  if(kind === 'quarterly'){
    var y = currentYearOf(now), q = currentQuarterOf(now);
    var m = _pndLoadQuarterly();
    var rec = m[qKey(person.id, y, q)];
    var base;
    if(rec && rec.archivedAt) base = { cls:'c-grn', lbl:q+' '+y+' complete' };
    else if(rec && (rec.approvals && Object.keys(rec.approvals).some(function(k){return rec.approvals[k].signedAt;}))) base = { cls:'c-amb', lbl:q+' '+y+' in progress' };
    else base = { cls:'c-gry', lbl:q+' '+y+' not started' };
    return withSchedule(base, y+'-'+q);
  } else {
    var yr = currentYearOf(now);
    var am = _pndLoadAnnual();
    var arec = am[aKey(person.id, yr)];
    var abase;
    if(arec && arec.archivedAt) abase = { cls:'c-grn', lbl:yr+' complete' };
    else if(arec && (arec.approvals && Object.keys(arec.approvals).some(function(k){return arec.approvals[k].signedAt;}))) abase = { cls:'c-amb', lbl:yr+' in progress' };
    else abase = { cls:'c-gry', lbl:yr+' not started' };
    return withSchedule(abase, String(yr));
  }
}

  }
}

function _pndRenderSparkline(scores){
  /* Small SVG line chart showing the 4-week score trace inside a KPI card. */
  var w = 110, hh = 34, n = scores.length, pad = 3;
  if(!n) return '<svg width="'+w+'" height="'+hh+'"></svg>';
  var stepX = n>1 ? (w-pad*2)/(n-1) : 0;
  var pts = scores.map(function(s, i){
    var y = s.pct==null ? hh/2 : (hh - pad) - ((s.pct/100)*(hh - pad*2));
    return (pad + i*stepX)+','+y;
  });
  var path = 'M '+pts.join(' L ');
  var lastPct = scores[n-1] ? scores[n-1].pct : null;
  var color = lastPct==null?'var(--txm)':lastPct>=90?'var(--grn)':lastPct>=80?'var(--amb)':'var(--red)';
  /* End-point dot marks the latest week */
  var lastPt = pts[pts.length-1].split(',');
  return '<svg width="'+w+'" height="'+hh+'" viewBox="0 0 '+w+' '+hh+'" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">'+
           '<path d="'+path+'" stroke="'+color+'" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>'+
           '<circle cx="'+lastPt[0]+'" cy="'+lastPt[1]+'" r="3" fill="'+color+'"/>'+
         '</svg>';
}

function _pndAdminTotals(visiblePeople, thisMonday){
  var huddlesDue = 0, pendingQtr = 0, pendingAnn = 0, below80 = 0;
  visiblePeople.forEach(function(p){
    var std = standardFor(p);
    if(std){
      var st = _pndHuddleStatusThisWeek(p.id, thisMonday);
      if(isHuddleWeek(p, thisMonday) && (st === 'not-started' || st === 'in-progress')) huddlesDue++;
      var scores = _pndLastNScores(p.id, thisMonday, 4).filter(function(s){return s.pct!=null;});
      if(scores.length){
        var avg = scores.reduce(function(sum,s){return sum+s.pct;},0)/scores.length;
        if(avg < 80) below80++;
      }
    }
  });
  /* Count pending quarterlies and annuals across all people */
  var qm = _pndLoadQuarterly();
  Object.keys(qm).forEach(function(k){ if(qm[k] && !qm[k].archivedAt) pendingQtr++; });
  var am = _pndLoadAnnual();
  Object.keys(am).forEach(function(k){ if(am[k] && !am[k].archivedAt) pendingAnn++; });
  return { huddlesDue:huddlesDue, pendingQtr:pendingQtr, pendingAnn:pendingAnn, below80:below80 };
}

function _personBg(p){
  /* Simple color-slot lookup - matches the person avatar palette elsewhere. */
  var slots = ['#6b8e5a','#5b8fd6','#c0663f','#8a6fb8','#3f9d8a','#9c5f4e','#4a6b6d','#a68140','#6b6b8e','#7c8c56','#b39268','#4c6b5f'];
  return slots[(p.colorSlot||0) % slots.length];
}

function reportOptions(){
  var reps = pdVisiblePeople();
  if(!reps.length) return '';
  if(!state.reportId || !reps.find(function(r){return r.id===state.reportId;})){
    var cu = currentUser();
    var mode = pdAccessMode();
    /* Employees land on themselves. Admins (and supervisors whose own role has no
       standard) land on the first visible person that has a defined role
       standard, so they see a real scorecard on entry rather than an empty
       state on their own row. */
    var pick = null;
    if(mode==='employee'){
      pick = cu && reps.find(function(r){return r.id===cu.id;});
    } else {
      /* Prefer self if self has a standard defined. */
      var self = cu && reps.find(function(r){return r.id===cu.id;});
      if(self && standardFor(self)) pick = self;
      if(!pick) pick = reps.find(function(r){return r.id!==(cu&&cu.id) && standardFor(r);});
      if(!pick) pick = self || reps[0];
    }
    state.reportId = pick ? pick.id : reps[0].id;
  }
  return reps.map(function(r){
    return '<option value="'+r.id+'"'+(r.id===state.reportId?' selected':'')+'>'+esc(fullName(r))+' - '+esc(r.roleLabel||'')+'</option>';
  }).join('');
}

/* VSP meeting contract for this person's 1:1 (D-98 direction). VSP owns meetings
   and agendas; the P&D huddle is one agenda item inside that 1:1, not a competing
   meeting. Expected shape: { meetingId, name, cadence: 'weekly'|'biweekly'|'monthly',
   nextDate: 'YYYY-MM-DD', supervisorId } or null. Silent-fail-safe: when VSP is not
   mounted or has no meeting for the person, P&D falls back to its local ROLE_CADENCE.
   The VSP-side publisher is a VSP-thread task; until it ships, this returns 'none'. */
function _pndReadVspMeeting(personId){
  var api = window.SMB_VSP_MEETINGS;
  if(api && typeof api.forPerson === 'function'){
    try{
      var mt = api.forPerson(personId);
      if(mt && mt.cadence) return { meeting: mt, source: 'VSP' };
    }catch(e){}
  }
  return { meeting: null, source: 'none' };
}
/* All Mondays that fall within the calendar quarter (Q1=Jan-Mar, Q2=Apr-Jun,
   Q3=Jul-Sep, Q4=Oct-Dec). Used by the Quarterly page to embed a scorecard
   grid pinned to the quarter's own weeks. */
function _weeksForQuarter(year, q){
  var qMonth = {Q1:0, Q2:3, Q3:6, Q4:9}[q];
  if(qMonth == null) return [];
  var start = _mondayOnOrAfter(new Date(year, qMonth, 1));
  var end   = _mondayOnOrBefore(new Date(year, qMonth+3, 0));
  var weeks = [];
  var iter = start;
  while(iter <= end){ weeks.push(iter); iter = addDays(iter, 7); }
  return weeks;
}
function _pndReadHrRoles(personId){
  var api = window.BOSHR;
  if(api && typeof api.getPerson === 'function'){
    try{
      var p = api.getPerson(personId);
      if(p && Array.isArray(p.responsibilities)) return { roles: p.responsibilities, source: 'HR' };
    }catch(e){}
  }
  return { roles: null, source: 'none' };
}

function _pndLoadReviewDates(){ try{ var v=localStorage.getItem('smb_pnd_review_dates_v1'); return v?JSON.parse(v):{}; }catch(e){ return {}; } }
function _pndSaveReviewDates(m){ try{ localStorage.setItem('smb_pnd_review_dates_v1', JSON.stringify(m)); }catch(e){} }
function _reviewDateKey(personId, kind, period){ return personId+'__'+kind+'__'+period; }
function getReviewDate(personId, kind, period){

function setReviewDate(personId, kind, period, date, time){

function pndSetReviewDate(personId, kind, period, date){

/* Open the user's mail client (Outlook) with a pre-drafted email. Same
   no-backend mechanism BD/CRM use: mailto with recipient, subject, and body
   prefilled; the user reviews and hits Send. Real server-side send arrives
   with the Postmark backend through the existing SMB_MAIL seam. */
function _pndMailto(to, cc, subject, body){
  var href = 'mailto:'+encodeURIComponent(to||'')+
             '?subject='+encodeURIComponent(subject||'')+
             (cc?'&cc='+encodeURIComponent(cc):'')+
             '&body='+encodeURIComponent(body||'');
  var a = document.createElement('a');
  a.href = href; a.style.display='none';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* Email a sign-off reminder to the next unsigned step in the approval chain. */
function pndEmailSignReminder(subjectPersonId, kind){
  var chain = _pndBuildApprovalChain(subjectPersonId);
  var rec = (kind==='annual') ? getAnnual() : getQuarterly();
  var next = null;
  for(var i=0;i<chain.length;i++){
    var ap = (rec.approvals||{})[chain[i].key];

  }
  if(!next){ toast('Nothing awaiting - all signatures are in'); return; }

             fullName(subj)+"'s "+period+' '+kindLbl.toLowerCase()+' is complete and waiting on your signature ('+next.label+').\n\n'+
             'Open the P&D module to review and sign.\n\n'+
             'Thanks,\n'+(currentUser()?currentUser().first:'');

/* Build a downloadable .ics calendar file for a review. Universal format that
   Outlook, Google Calendar, and Apple Calendar all import. No backend needed. */
function _buildReviewIcs(person, kind, period, date, time){
  var t = (time||'09:00').replace(':','')+'00';
  var d = date.replace(/-/g,'');
  var dtStart = d+'T'+t;
  /* 1-hour default duration */
  var endH = String(Math.min(23, parseInt((time||'09:00').split(':')[0],10)+1)).padStart(2,'0');
  var dtEnd = d+'T'+endH+(time||'09:00').split(':')[1]+'00';
  var kindLbl = kind==='quarterly'?'Quarterly Performance Huddle':'Annual Performance Development Plan';
  var uid = 'pnd-'+person.id+'-'+kind+'-'+period+'@selfmanagingbuilder.com';
  var stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  var lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Self-Managing Builder//P&D//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+stamp,'DTSTART:'+dtStart,'DTEND:'+dtEnd,
    'SUMMARY:'+kindLbl+' - '+fullName(person),
    'DESCRIPTION:'+kindLbl+' review for '+fullName(person)+' ('+period+'). Scheduled in Self-Managing Builder.',
    'STATUS:CONFIRMED','END:VEVENT','END:VCALENDAR'
  ];
  return lines.join('\r\n');
}
function pndDownloadReviewIcs(personId, kind, period){
  var person = personById(personId);
  var rd = getReviewDate(personId, kind, period);
  if(!person || !rd){ toast('Set a review date first'); return; }
  var ics = _buildReviewIcs(person, kind, period, rd.date, rd.time);
  try{
    var blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = kind+'-review-'+person.initials+'-'+period+'.ics';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast('Calendar file downloaded. Open it to add to Outlook.');
  }catch(e){ toast('Could not generate the calendar file'); }
}

/* Resolve the 5-slot approval chain for a given person.
   - Team Member: the person themselves.
   - Supervisor: their reportsTo.
   - VP of Construction Operations: LIDA seed roleLabel === 'VP Construction'.
   - HR: any active person with hr === true.
   - President: any active person with roleLabel === 'President' or 'Owner'.
   Dedupe by person id (if same person occupies two slots, keep the earliest).
   Slots that cannot be resolved are skipped. */
function _pndBuildApprovalChain(personId){
  var person = personById(personId);
  if(!person) return [];
  var all = people().filter(function(p){ return p.status==='active'; });
  var raw = [
    { key:'teamMember',     label:'Team Member',                    person: person },
    { key:'supervisor',     label:'Supervisor',                     person: person.reportsTo ? personById(person.reportsTo) : null },
    { key:'vpConstruction', label:'VP of Construction Operations',  person: all.find(function(p){ return p.roleLabel==='VP Construction'; }) || null },
    { key:'hr',             label:'HR',                             person: all.find(function(p){ return p.hr===true && p.roleLabel!=='President' && p.roleLabel!=='Owner'; }) || all.find(function(p){ return p.hr===true; }) || null },
    { key:'president',      label:'President',                      person: all.find(function(p){ return p.roleLabel==='President' || p.roleLabel==='Owner'; }) || null }
  ];
  var seen = {};
  return raw.filter(function(step){
    if(!step.person) return false;                 /* slot cannot be resolved - skip */
    if(seen[step.person.id]) return false;         /* same person already in chain - dedupe */
    seen[step.person.id] = true;
    return true;
  });
}

/* Archive: called automatically when the last chain step signs.
   Sets rec.archivedAt on the record and locks all edits. Records are not moved;
   they stay in smb_perf_quarterly_v1 keyed as before so historical navigation
   works. Read-only rendering keys off rec.archivedAt. */
function _pndAutoArchiveIfComplete(){
  var rec = getQuarterly();
  if(rec.archivedAt) return false;
  var chain = _pndBuildApprovalChain(state.reportId);
  if(!_pndAllApproved(rec, chain)) return false;
  rec.archivedAt = new Date().toISOString();

  _pndSaveQuarterly(m);

}

/* Home Alert Queue v1 publish.
   Rebuilds window.SMB_ALERT_MAP.pnd from every active (non-archived) quarterly
   huddle in storage. For each huddle, finds the next unsigned chain step and
   publishes ONE alert targeted at that step's assigned person. When the chain
   completes and the huddle auto-archives, no alert is emitted for it.
   The master shell consumes this map and surfaces the alerts on Home. */
function _pndPublishAlerts(){
  window.SMB_ALERT_MAP = window.SMB_ALERT_MAP || {};
  var m = _pndLoadQuarterly();
  var alerts = [];
  Object.keys(m).forEach(function(key){
    var rec = m[key]; if(!rec || rec.archivedAt) return;
    var parts = key.split('__');
    if(parts.length !== 3) return;
    var personId = parts[0], year = parseInt(parts[1]), q = parts[2];
    var subj = personById(personId); if(!subj) return;
    var chain = _pndBuildApprovalChain(personId);
    /* First unsigned step is the "awaiting" alert. */
    for(var i=0; i<chain.length; i++){
      var step = chain[i];
      var priorSigned = (i===0) ? true : (rec.approvals && rec.approvals[chain[i-1].key] && rec.approvals[chain[i-1].key].signedAt);
      var thisSigned = rec.approvals && rec.approvals[step.key] && rec.approvals[step.key].signedAt;
      if(priorSigned && !thisSigned){
        alerts.push({
          id: 'pnd.approval.' + key + '.' + step.key,
          kind: 'pnd.approval.awaiting',
          module: 'pnd',
          severity: 'action',
          targetPersonId: step.person.id,
          subjectPersonId: personId,
          title: fullName(subj)+"'s "+q+" "+year+" huddle needs your sign-off",
          body: 'Awaiting the '+step.label+' review and sign-off.',
          route: { page: 'quarterly', personId: personId, year: year, quarter: q, slot: step.key },
          createdAt: new Date().toISOString()
        });
        break;
      }
    }
  });
  window.SMB_ALERT_MAP.pnd = alerts;
  return alerts;
}

}

   Prominent at the top of Quarterly and Annual pages so users see completion state
   at a glance without scrolling to the Approvals card. Clicking a slot scrolls to
   the Approvals card for the full detail. */
function _pndRenderSigProgress(rec, chain){
  if(!chain || !chain.length) return '';
  var signed = 0;
  var dots = chain.map(function(step){
    var appr = rec.approvals && rec.approvals[step.key];
    var isSigned = !!(appr && appr.signedAt);

  }).join('');

           '<div class="q-sig-bar-wrap"><div class="q-sig-bar-fill" style="width:'+pct+'%"></div></div>'+
           '<div class="q-sig-dots">'+dots+'</div>'+

         '</div>';

/* Roll up the weekly huddles inside a given quarter for a given person.
   Uses the same formula as the Weekly page: any hard-fail row forces that week
   to 0%; Away weeks are excluded from both numerator and denominator. */
function _pndQuarterlyRollup(personId, year, q){
  var std = standardFor(personById(personId));
  if(!std) return {avg:null, weeksRecorded:0, weeksAway:0, hardFailWeeks:0, weeksInQuarter:13};
  var all = (typeof _pndLoadHuddles==='function') ? _pndLoadHuddles() : {};
  var qi = parseInt(q.replace('Q','')) || 1;
  var qStart = (qi-1)*3, qEnd = qStart+3;                 // 0-indexed months
  var scores=[], away=0, hf=0;
  function isYesVal(v){ if(v==null) return false; var s=String(v).trim().toLowerCase(); return (s==='yes'||s==='y'||s==='true'||s==='1'); }
  Object.keys(all).forEach(function(key){
    if(key.indexOf(personId+'__')!==0) return;
    var iso = key.substring(personId.length+2);
    var p = iso.split('-'); if(p.length!==3) return;
    var wYear=parseInt(p[0]), wMonth=parseInt(p[1])-1;
    if(wYear!==year || wMonth<qStart || wMonth>=qEnd) return;
    var rec = all[key];
    if(rec.away){ away++; return; }
    var yes=0, hardFail=false;
    std.forEach(function(row){
      var v = rec.answers && rec.answers[row.id];
      if(isYesVal(v)) yes++;
      else if(row.hard) hardFail = true;
    });
    if(hardFail) hf++;
    var raw = std.length ? Math.round(yes/std.length*100) : 0;
    scores.push(hardFail ? 0 : raw);
  });
  var avg = scores.length ? Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length) : null;
  return {avg:avg, weeksRecorded:scores.length, weeksAway:away, hardFailWeeks:hf, weeksInQuarter:13};
}

/* Last completed Delegate & Elevate lookup (annual artifact, read from same store) */
function _pndLastDelegate(personId){
  var m = _pndLoadQuarterly();

  Object.keys(m).forEach(function(k){
    if(k.indexOf(personId+'__')!==0) return;
    var rec = m[k];
    if(!rec || !rec.delegate) return;
    if(!best || (rec.savedAt||'') > (best.savedAt||'')) best = rec;
  });
  return best;
}

/* Range selector for the stacked-phase view. Matches VSP scorecard's tab labels
   so rotating and non-rotating scorecards use the same date vocabulary. */
function setRotatingRange(r){ state.rotatingRange = r; renderPage(); }

/* Legacy no-op kept in case any past instrumentation calls it. Phase filter
   was replaced by the stacked-phase view. */
function setPhaseFilter(phase){
  state.phaseFilter = (phase>=1 && phase<=4) ? phase : null;
  renderPage();

/* --- Rotating-standard huddle: stacked view across all phases in one page.
   Every phase gets its own mini-grid (10 rows x N weeks in the selected range
   where active phase matches). Top of page shows a Combined Score across all
   phases in the range. Same date-range vocabulary as VSP scorecard tabs. */
function weeksForRotatingRange(range, curIso){
  var end = curIso;
  var start = end;
  var parts = String(curIso).split('-');
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  if(range==='custom'){
    /* Follow VSP's custom range - anchored to state.scCustomStart / .scCustomEnd */
    var s = state.scCustomStart, e = state.scCustomEnd;
    if(s && e){
      var sd = new Date(s+'T00:00:00'), ed = new Date(e+'T00:00:00');
      if(!isNaN(sd.getTime()) && !isNaN(ed.getTime())){
        if(sd > ed){ var tmp = sd; sd = ed; ed = tmp; }
        start = _mondayOnOrAfter(sd);
        end   = _mondayOnOrBefore(ed);
      } else { start = addDays(end, -12*7); }
    } else { start = addDays(end, -12*7); }
  }
  else if(range==='last4'){        start = addDays(end, -3*7); }
  else if(range==='qtd'){
    var y = d.getFullYear(), qStartMonth = Math.floor(d.getMonth()/3)*3;
    start = _mondayOnOrAfter(new Date(y, qStartMonth, 1));
  }
  else if(range==='yearToDate' || range==='ytd'){
    start = _mondayOnOrAfter(new Date(d.getFullYear(), 0, 1));
  }
  else if(range==='fullYear'){
    start = _mondayOnOrAfter(new Date(d.getFullYear(), 0, 1));
    end   = _mondayOnOrBefore(new Date(d.getFullYear(), 11, 31));
  }
  else if(range==='rolling52'){ start = addDays(end, -51*7); }
  else { /* default 'last13' matches an EOS quarter */ start = addDays(end, -12*7); }
  var weeks = [];
  var iter = start;
  while(iter <= end){ weeks.push(iter); iter = addDays(iter, 7); }
  return weeks;
}
function _mondayOnOrAfter(dt){
  var dow = dt.getDay();
  var offset = (dow===0) ? 1 : (dow===1) ? 0 : (8-dow);
  var m = new Date(dt.getTime() + offset*86400000);
  return m.toISOString().substring(0,10);
}
function _mondayOnOrBefore(dt){
  var dow = dt.getDay();
  var offset = (dow===1) ? 0 : (dow===0) ? -6 : (1-dow);
  var m = new Date(dt.getTime() + offset*86400000);
  return m.toISOString().substring(0,10);
}
function _shortWk(iso){
  var p = iso.split('-');
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return mo[dt.getMonth()]+' '+String(dt.getDate()).padStart(2,'0');
}

function renderRotatingHuddle(person){
  var roleDef = ROLE_STANDARDS[person.roleLabel];
  if(!roleDef || !roleDef.weeks) return '';
  /* Follow the same date range as every scorecard on the page. VSP's Date Range
     dropdown in any of the 4 phase scorecards writes to state.scorecardDateRange;
     since state is module-level, changing it in one grid syncs all 4 AND the
     Combined Score card here. Retired keys (fullYear, rolling52) fall back to
     last13 so a session that picked one before the dropdown was trimmed still
     resolves cleanly. */
  var validRanges = ['last4','last13','qtd','yearToDate','ytd','custom'];
  var range = state.scorecardDateRange || 'last13';
  if(validRanges.indexOf(range) === -1) range = 'last13';
  var weeks = weeksForRotatingRange(range, state.weekIso);
  var all = _pndLoadHuddles();

  /* Combined score across all phases within the selected range.
     Same formula as the weekly-score row so numbers match end-to-end:
       weekly = (Yes count) / (total items in that phase) * 100
       hard-fail week = 0
       empty week (no huddle record) = 0
       Away weeks excluded entirely
       Combined = average of per-week percentages across counted weeks. */
  var weeklyPcts = [];
  var hardFailWeeks = 0, weeksRecorded = 0, weeksAway = 0;
  weeks.forEach(function(iso){
    var rec = all[person.id+'__'+iso];
    if(rec && rec.away){ weeksAway++; return; }
    if(!isWeekTracked(personId, iso)) return;               /* before tracking started - not counted */
    if(!rec){ weeklyPcts.push(0); return; }                 /* empty week counts as 0% */
    var phase = activePhaseFor(person, iso);
    var std = roleDef.weeks[phase-1].items;
    var yes=0, hard=false, anyAnswered=false;
    std.forEach(function(row){
      var v = rec.answers && rec.answers[row.id];
      if(v==='yes' || v==='no') anyAnswered = true;
      if(v==='yes') yes++;
      else if(row.hard) hard = true;
    });
    if(!anyAnswered){ weeklyPcts.push(0); return; }         /* record exists but no answers = 0% */
    weeksRecorded++;
    if(hard){ hardFailWeeks++; weeklyPcts.push(0); }
    else { weeklyPcts.push(Math.round(yes/std.length*100)); }
  });
  var combined = weeklyPcts.length ? Math.round(weeklyPcts.reduce(function(a,b){return a+b;},0)/weeklyPcts.length) : null;
  var combinedColor = combined==null?'var(--txm)':combined>=90?'var(--grn)':combined>=75?'var(--amb)':'var(--red)';

  var h = '';
  h += '<div class="rot-combined">'+
       '<div class="rot-combined-l"><div class="rot-combined-lbl">Combined Score ('+esc(rangeLabel(range))+')</div><div class="rot-combined-val" style="color:'+combinedColor+'">'+(combined==null?'-':combined+'%')+'</div></div>'+
       '<div class="rot-combined-r">'+weeksRecorded+' of '+weeks.length+' weeks recorded &middot; '+weeksAway+' Away &middot; '+hardFailWeeks+' hard-fail week'+(hardFailWeeks===1?'':'s')+'</div>'+
       '</div>';

  /* Call VSP renderScorecardPND once per phase, filtering weeks to that phase.
     Only the current phase's rendering gets the edit-metric overlay - stable
     em/ng/eg IDs would collide if included in all four. Snapshot each phase's
     module state before the next render overwrites it, so cell clicks can
     route to the correct phase's data. */
  _pndResetPhaseState();
  var curActivePhase = activePhaseFor(person, state.weekIso);
  for(var phase=1; phase<=4; phase++){
    var info = roleDef.weeks[phase-1];
    var phaseWeeks = weeks.filter(function(iso){ return activePhaseFor(person, iso) === phase; });
    var isCurrent = (phase === curActivePhase);
    h += '<div class="rot-phase'+(isCurrent?' current':'')+'" data-phase="'+phase+'">';
    h += '<div class="rot-phase-hd"><span class="rot-phase-t">'+esc(info.title)+'</span>'+(isCurrent?'<span class="rot-phase-badge">This week</span>':'')+'</div>';
    if(!phaseWeeks.length){
      h += '<div class="empty" style="padding:20px">No weeks in this range fell in this phase.</div>';
    } else {
      h += renderScorecardPND(person, info.items, { weeks: phaseWeeks, skipOverlay: !isCurrent });
      _pndSnapshotPhaseState(phase);
    }
    h += '</div>';
  }

  return h;
}

function rangeLabel(r){
  return { last4:'Last 4 Weeks', last13:'Last 13 Weeks', qtd:'Quarter to Date', yearToDate:'Year to Date', ytd:'Year to Date', fullYear:'Full Year', rolling52:'Rolling 52 Weeks', custom:'Custom Range' }[r] || 'Last 13 Weeks';
}

function renderQuarterly(){
  var reps = pdVisiblePeople();
  if(!reps.length){
    return '<h1 class="pg-title">Quarterly Performance Huddle</h1>'+
      '<div class="empty">No people are visible under your scope. If you should be seeing your team here, ask HR to check your supervisor flag.</div>';
  }
  if(!state.reportId || !reps.find(function(r){return r.id===state.reportId;})){
    var cu = currentUser();
    var self = cu && reps.find(function(r){return r.id===cu.id;});
    var pick;
    if(pdAccessMode()==='employee') pick = self;
    else if(self && standardFor(self)) pick = self;
    else pick = reps.find(function(r){return standardFor(r);}) || self || reps[0];
    state.reportId = pick.id;
  }

       '<div style="margin-bottom:14px"><label class="q-cul-lbl">Decisions made</label>'+
       '<textarea class="q-ta" onchange="qSetIssue(\'decisions\',this.value)" placeholder="Agreements reached during this conversation"'+(archived?' readonly':'')+'>'+esc(iss.decisions||'')+'</textarea></div>'+

       '</div></div>';


  // ================== NEW SECTION 10: Next Quarter's Goals (VSP is source of truth) ==================
  var _nextInfo = _pndNextQuarter(state.quarterlyYear, state.quarterlyQ);

      var _gsCls = g.status==='done'?'c-blu':g.status==='ontrack'?'c-grn':g.status==='offtrack'?'c-red':'c-gry';
      var _gsLbl = g.status==='done'?'Done':g.status==='ontrack'?'On Track':g.status==='offtrack'?'Off Track':'-';

           (g.status?'<span class="chip '+_gsCls+'">'+esc(_gsLbl)+'</span>':'<span></span>')+
           '<span></span></div>';
    });
  }
  h += '</div></div>';


  // ================== SECTION 12: Approvals & Sign-offs (5-role chain) ==================
  var chain = _pndBuildApprovalChain(state.reportId);
  var cu = currentUser();
  rec.approvals = rec.approvals || {};
  h += '<div class="q-card q-appr"><div class="q-card-hd"><div class="q-t">Approvals &amp; Sign-offs</div><div class="q-m">Each role reads, adds notes, and signs. Order: Team Member first, then up the chain.</div>'+
       (!archived ? '<div class="q-actions"><button type="button" class="q-mbtn" onclick="pndEmailSignReminder(\''+state.reportId+'\',\'quarterly\')" title="Opens Outlook drafted to whoever is next in the chain">Email a reminder</button></div>' : '')+
       '</div><div class="q-card-bd">';
  h += '<div class="q-appr-lead">Sequential approval. A step unlocks when the prior step is signed.</div>';
  var priorSigned = true;                                    /* first step always unlocked */
  chain.forEach(function(step, i){
    var appr = rec.approvals[step.key] || { notes:'', signedAt:null, signedBy:null };
    var signed = !!appr.signedAt;
    var isMe = cu && cu.id === step.person.id;
    var unlocked = priorSigned;                              /* can this slot be actioned yet? */
    var isCurrent = unlocked && !signed;
    var canSign = unlocked && !signed && isMe && !archived;  /* archived locks all further action */
    var canEdit = canSign;                                   /* editable only when it's your turn and not yet signed */

    var cls = 'q-appr' + (signed?' signed':'') + (!signed && !unlocked ? ' locked' : '') + (isCurrent?' current':'');
    h += '<div class="'+cls+'">';
    h += '<div class="q-appr-hd">';
    h += '<div class="q-appr-num">'+(signed?_check():String(i+1))+'</div>';
    h += '<div class="q-appr-titles">';
    h += '<div class="q-appr-role">'+esc(step.label)+'</div>';
    h += '<div class="q-appr-person">'+esc(fullName(step.person))+(step.person.roleLabel?' &middot; <span style="color:var(--txm);font-weight:400">'+esc(step.person.roleLabel)+'</span>':'')+'</div>';
    h += '</div>';
    h += '</div>';
    /* Notes: editable only when it's this user's turn and not yet signed. Others see it read-only. */
    var placeholder = canEdit ? 'Add your notes before signing (optional)' : (signed ? '' : 'Notes will appear once '+step.person.first+' completes this step');
    h += '<textarea class="q-appr-notes" '+(canEdit?'':'readonly')+' onchange="qSetApprovalNotes(\''+step.key+'\',this.value)" placeholder="'+escAttr(placeholder)+'">'+esc(appr.notes||'')+'</textarea>';
    h += '<div class="q-appr-foot">';
    if(signed){
      var signerName = appr.signedBy ? (personById(appr.signedBy)?fullName(personById(appr.signedBy)):fullName(step.person)) : fullName(step.person);
      h += '<div class="q-appr-signed">'+_check()+' Signed by '+esc(signerName)+' on '+esc(appr.signedAt.substring(0,10))+'</div>';
    } else if(!unlocked){
      var priorStep = chain[i-1];
      h += '<div class="q-appr-blocked">Waiting on '+esc(priorStep?priorStep.label:'prior step')+' to sign.</div>';
    } else if(isMe){
      h += '<div class="q-appr-unsigned">Ready for your sign-off.</div>';
      h += '<button class="q-appr-btn" onclick="qSignApproval(\''+step.key+'\')">Sign &amp; Approve</button>';
    } else {
      h += '<div class="q-appr-unsigned">Waiting on '+esc(step.person.first)+' to sign.</div>';
    }
    h += '</div>';
    h += '</div>';

    priorSigned = signed;                                    /* next iteration checks off this one */
  });
  if(!chain.length){
    h += '<div class="empty">No approval chain could be resolved. Check the org chart in HR.</div>';
  }
  h += '</div></div>';

  return h;
}

function _formatBytes(bytes){
  if(bytes<1024) return bytes+' B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1024/1024).toFixed(2)+' MB';
}

function _qVal(who, i, cur){
  var p = cur==='+' ? ' on' : '';
  var m = cur==='+/-' ? ' on' : '';

     so the emitted onclick is a string literal, not a ReferenceError. */
  var iArg = (typeof i==='number') ? i : '\''+i+'\'';

function _goalStatusChip(status, i){
  var opts = [['done','Done','c-blu'],['ontrack','On Track','c-grn'],['offtrack','Off Track','c-red']];

/* VSP-vocabulary status select for the Quarterly Goals mirror. VSP uses
   on-track / off-track / complete. Wraps the change through qSetGoalStatus,
   which persists as a per-huddle override until a real VSP write API lands.
   Uses the .q-goal-select base (module-CSS select chrome) plus canon .c-*
   color modifiers (chip color vocabulary), so the dropdown tint matches the
   chip vocabulary without being a chip element itself. */
function _vspGoalStatusSelect(goalKey, status, archived){
  var opts = [['on-track','On Track','c-grn'],['off-track','Off Track','c-red'],['complete','Done','c-blu']];
  var cur = opts.find(function(o){ return o[0]===status; });
  var cls = cur ? cur[2] : '';
  var attrs = archived ? ' disabled' : '';
  return '<select class="q-goal-select'+(cls?' '+cls:'')+'" onchange="qSetGoalStatus(\''+escAttr(goalKey)+'\',this.value)"'+attrs+'>'+
         opts.map(function(o){return '<option value="'+o[0]+'"'+(status===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+
         '</select>';
}
function _q110(key, v){

  for(var i=1;i<=10;i++){
    var tier = i<=3 ? 't1' : i<=6 ? 't2' : 't3';

    h += '<button class="q-scale-cell'+filled+'" onclick="qSetCulture(\''+key+'\','+i+')">'+i+'</button>';

/* 1-5 rating strip - used by Manager Feedback where each item scores 1-5 and

function _q15(key, v){
  var vInt = parseInt(v);
  var h = '<div class="q-scale" style="max-width:220px">';
  for(var i=1;i<=5;i++){
    var tier = i<=2 ? 't1' : i<=3 ? 't2' : 't3';
    var filled = vInt >= i ? ' filled '+tier : '';
    h += '<button class="q-scale-cell'+filled+'" onclick="qSetMFeedbackRating(\''+key+'\','+i+')">'+i+'</button>';
  }
  h += '</div>';
  return h;
}

/* Compute the next-quarter marker from the current one. Q4/2026 -> Q1/2027. */
function _pndNextQuarter(year, q){
  var y = parseInt(year, 10);
  var qi = ['Q1','Q2','Q3','Q4'].indexOf(q);
  if(qi < 0) return { year:y, q:'Q1' };
  if(qi === 3) return { year:y+1, q:'Q1' };
  return { year:y, q:['Q1','Q2','Q3','Q4'][qi+1] };
}

function getAnnual(){
  var m = _pndLoadAnnual();
  return m[aKey(state.reportId, state.annualYear)] || blankAnnual();
}
function putAnnual(rec){
  var m = _pndLoadAnnual();
  rec.savedAt = new Date().toISOString();
  m[aKey(state.reportId, state.annualYear)] = rec;
  _pndSaveAnnual(m);
  try{ emitPndSignals(); }catch(e){}
  try{ window.dispatchEvent(new CustomEvent('bos.performance.changed',{detail:{personId:state.reportId, kind:'annual'}})); }catch(e){}
}

/* Rocks read from Quarterly Huddle for that person/year/quarter */
function _pndReadQuarterlyRocks(personId, year, q){
  var m = _pndLoadQuarterly();
  var rec = m[personId+'__'+year+'__'+q];
  if(!rec) return null;
  return rec.goals || [];
}

/* Read a quarter's weekly-avg for Performance Points */
function _pndQuarterAvg(personId, year, q){
  var r = _pndQuarterlyRollup(personId, year, q);
  return r ? r.avg : null;
}

/* Annual sign flow reuses same approval-chain and archive helpers as Quarterly */
function _pndAnnualAllApproved(rec, chain){
  if(!chain || !chain.length) return false;
  return chain.every(function(step){
    return rec.approvals && rec.approvals[step.key] && rec.approvals[step.key].signedAt;
  });
}
function _pndAutoArchiveAnnual(){
  var rec = getAnnual();
  if(rec.archivedAt) return false;
  var chain = _pndBuildApprovalChain(state.reportId);
  if(!_pndAnnualAllApproved(rec, chain)) return false;
  rec.archivedAt = new Date().toISOString();
  var m = _pndLoadAnnual();
  m[aKey(state.reportId, state.annualYear)] = rec;
  _pndSaveAnnual(m);
  return true;
}

function _pndRenderFramework(fw, rec, archived){
  var h = '';
  // Header block
  h += '<div class="q-card"><div class="q-card-hd"><div class="q-t">'+esc(fw.headerTitle)+'</div></div><div class="q-card-bd" style="line-height:1.55">';

  h += '<p><b>How This Review Is Used:</b> '+esc(fw.header.howUsed)+'</p>';
  h += '<p><b>Cadence:</b> '+esc(fw.header.cadence)+'</p>';
  h += '<p><b>Important:</b> '+esc(fw.header.important)+'</p>';
  h += '<h3 style="margin-top:18px;font-size:var(--fz-lg);font-weight:700">Applies to Every Line Item</h3>';
  h += '<div style="font-size:var(--fz-body);color:var(--txm);margin-bottom:10px">'+esc(fw.rubricNote)+'</div>';
  fw.rubric.forEach(function(r){
    h += '<div style="margin-bottom:4px;font-size:var(--fz-body)"><b style="color:var(--module-accent)">'+r.n+' - '+esc(r.label)+':</b> '+esc(r.text)+'</div>';
  });
  h += '<h3 style="margin-top:18px;font-size:var(--fz-lg);font-weight:700">Rules</h3><ul style="margin:0;padding-left:20px">';
  fw.rules.forEach(function(rule){ h += '<li style="margin-bottom:4px">'+esc(rule)+'</li>'; });
  h += '</ul></div></div>';

  // Competency sections
  fw.competencies.forEach(function(comp, ci){
    var selfScores = [], supScores = [];
    comp.items.forEach(function(it, ii){
      var s = rec.framework[ci+'__'+ii+'__self']; var v = rec.framework[ci+'__'+ii+'__sup'];
      if(s!=null && s!=='') selfScores.push(parseInt(s));
      if(v!=null && v!=='') supScores.push(parseInt(v));
    });
    var selfAvg = selfScores.length ? (selfScores.reduce(function(a,b){return a+b;},0)/selfScores.length) : null;
    var supAvg = supScores.length ? (supScores.reduce(function(a,b){return a+b;},0)/supScores.length) : null;
    h += '<div class="q-card"><div class="q-card-hd"><div class="q-t">'+(ci+1)+'. '+esc(comp.title)+'</div><div class="q-m">'+esc(comp.tagline)+'</div></div><div class="q-card-bd">';
    h += '<table class="q-vf" style="width:100%"><thead><tr><th style="width:40px">#</th><th style="text-align:left">Behavior / Competency</th><th style="width:90px">Self Score (1-10)</th><th style="width:90px">Supervisor Score (1-10)</th></tr></thead><tbody>';
    comp.items.forEach(function(it, ii){
      var selfV = rec.framework[ci+'__'+ii+'__self'] || '';
      var supV = rec.framework[ci+'__'+ii+'__sup'] || '';
      h += '<tr><td>'+(ii+1)+'</td><td class="first" style="text-align:left">'+esc(it)+'</td>'+
           '<td><input type="number" min="1" max="10" style="width:60px;padding:5px 8px;border:1px solid var(--brd);border-radius:4px;text-align:center" value="'+escAttr(selfV)+'" onchange="aSetFramework('+ci+','+ii+',\'self\',this.value)"'+(archived?' readonly':'')+'></td>'+
           '<td><input type="number" min="1" max="10" style="width:60px;padding:5px 8px;border:1px solid var(--brd);border-radius:4px;text-align:center" value="'+escAttr(supV)+'" onchange="aSetFramework('+ci+','+ii+',\'sup\',this.value)"'+(archived?' readonly':'')+'></td></tr>';
    });
    h += '<tr style="background:var(--sur2)"><td colspan="2" style="text-align:right;font-weight:700">Section Average:</td>'+
         '<td style="text-align:center;font-weight:700">'+(selfAvg==null?'-':selfAvg.toFixed(1))+'</td>'+
         '<td style="text-align:center;font-weight:700">'+(supAvg==null?'-':supAvg.toFixed(1))+'</td></tr>';
    h += '</tbody></table>';
    h += '<div style="margin-top:14px"><label class="q-cul-lbl">Comments &amp; Examples:</label><textarea class="q-ta" onchange="aSetFrameworkComment('+ci+',this.value)"'+(archived?' readonly':'')+'>'+esc(rec.frameworkComments[ci]||'')+'</textarea></div>';
    h += '</div></div>';
  });

  // Summary & Prioritization
  h += '<div class="q-card"><div class="q-card-hd"><div class="q-t">Summary &amp; Prioritization</div><div class="q-m">Review the gaps and prioritize 3 key areas for development.</div></div><div class="q-card-bd">';
  h += '<table class="q-vf" style="width:100%"><thead><tr><th style="width:60px">Priority</th><th style="text-align:left">Competency</th><th>Avg Self Score</th><th>Avg Supervisor Score</th><th>Gap (+/-)</th></tr></thead><tbody>';
  var order = (rec.priorityOrder && rec.priorityOrder.length===fw.competencies.length) ? rec.priorityOrder : fw.competencies.map(function(_,i){return i;});
  order.forEach(function(ci, rank){
    var comp = fw.competencies[ci];
    var selfScores = [], supScores = [];
    comp.items.forEach(function(it, ii){
      var s = rec.framework[ci+'__'+ii+'__self']; var v = rec.framework[ci+'__'+ii+'__sup'];
      if(s!=null && s!=='') selfScores.push(parseInt(s));
      if(v!=null && v!=='') supScores.push(parseInt(v));
    });
    var sA = selfScores.length ? (selfScores.reduce(function(a,b){return a+b;},0)/selfScores.length) : 0;
    var pA = supScores.length ? (supScores.reduce(function(a,b){return a+b;},0)/supScores.length) : 0;
    var gap = (sA-pA);
    var gapColor = gap>0 ? 'var(--grn)' : (gap<0 ? 'var(--red)' : 'var(--txm)');
    var bg = rank<3 ? 'background:var(--ambb)' : '';
    h += '<tr style="'+bg+'"><td style="font-weight:700;color:var(--module-accent)">'+(rank+1)+'</td><td class="first" style="text-align:left">'+esc(comp.title)+'</td>'+
         '<td>'+sA.toFixed(1)+'</td><td>'+pA.toFixed(1)+'</td>'+
         '<td style="font-weight:700;color:'+gapColor+'">'+(gap>0?'+':'')+gap.toFixed(1)+'</td></tr>';
  });
  h += '</tbody></table>';
  h += '<div style="margin-top:8px;font-size:var(--fz-xs);color:var(--txm);font-style:italic">Top 3 highlighted rows become the Development Plan priorities below.</div>';
  h += '</div></div>';

  // 12-Month Development Plan (3 priority cards)
  h += '<div class="q-card"><div class="q-card-hd"><div class="q-t">12-Month Development Plan</div><div class="q-m">Identify 3 key areas specifically from the gaps above.</div></div><div class="q-card-bd">';
  rec.priorityPlans.forEach(function(p, pi){
    h += '<div style="border:1px solid var(--brd);border-radius:8px;padding:16px;margin-bottom:16px;background:var(--sur)">';
    h += '<div style="background:var(--ambb);color:var(--ambt);padding:8px 12px;font-weight:700;border-radius:4px;margin-bottom:14px">Priority #'+(pi+1)+'</div>';
    h += '<div style="margin-bottom:10px"><label class="q-cul-lbl">Competency Name:</label><input class="q-cv-input" style="border:1px solid var(--brd);padding:8px 10px;border-radius:6px;width:100%" value="'+escAttr(p.competencyName||'')+'" onchange="aSetPriority('+pi+',\'competencyName\',this.value)"'+(archived?' readonly':'')+'></div>';
    h += '<div style="margin-bottom:10px"><label class="q-cul-lbl">Why this is a priority (based on scores &amp; evidence):</label><div style="font-size:var(--fz-xs);color:var(--txm);margin-bottom:4px">Reference specific weak statements, recurring weekly scorecard items, performance points, and real project examples.</div><textarea class="q-ta" onchange="aSetPriority('+pi+',\'whyPriority\',this.value)"'+(archived?' readonly':'')+'>'+esc(p.whyPriority||'')+'</textarea></div>';
    h += '<div style="margin-bottom:10px"><label class="q-cul-lbl">12-Month Target State</label><div style="font-size:var(--fz-xs);color:var(--txm);margin-bottom:4px">"By this time next year, this competency will consistently score 8+ and will no longer appear as a recurring issue in scorecards, client feedback, or project outcomes."</div><label class="q-cul-lbl">Specific description of what "8-level" performance looks like:</label><textarea class="q-ta" onchange="aSetPriority('+pi+',\'targetStateDesc\',this.value)"'+(archived?' readonly':'')+'>'+esc(p.targetStateDesc||'')+'</textarea></div>';
    h += '<div style="margin-bottom:10px"><label class="q-cul-lbl">Specific Behavior Changes Required (Observable)</label>';
    p.behaviors.forEach(function(b, bi){
      h += '<div class="q-role-row"><span class="q-role-num">'+(bi+1)+'.</span><textarea class="q-role-input" onchange="aSetPriorityBehavior('+pi+','+bi+',this.value)" placeholder="Observable behavior..."'+(archived?' readonly':'')+'>'+esc(b||'')+'</textarea></div>';
    });
    h += '</div>';
    h += '<div style="margin-bottom:10px"><label class="q-cul-lbl">How We Will Measure Improvement</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
    var mLabels = [['scorecard','Weekly scorecard trend improvement'],['client','Client feedback improvement'],['escalations','Fewer escalations'],['supervisor','Supervisor observation'],['projectResults','Project results (schedule, margin)'],['fewerRecurring','Fewer recurring issues in:']];
    mLabels.forEach(function(m){
      h += '<label style="display:flex;align-items:center;gap:6px;font-size:var(--fz-body)"><input type="checkbox" '+(p.measures[m[0]]?'checked':'')+' onchange="aSetPriorityMeasure('+pi+',\''+m[0]+'\',this.checked)"'+(archived?' disabled':'')+'>'+esc(m[1])+'</label>';
    });
    h += '</div>';
    h += '<div style="margin-top:6px"><input class="q-cv-input" style="border:1px solid var(--brd);padding:6px 10px;border-radius:6px;width:100%;max-width:400px" value="'+escAttr(p.fewerIn||'')+'" onchange="aSetPriority('+pi+',\'fewerIn\',this.value)" placeholder="Specify issues..."'+(archived?' readonly':'')+'></div></div>';
    h += '<div style="margin-bottom:10px"><label class="q-cul-lbl">Specific proof we expect to see:</label><textarea class="q-ta" onchange="aSetPriority('+pi+',\'proof\',this.value)"'+(archived?' readonly':'')+'>'+esc(p.proof||'')+'</textarea></div>';
    h += '<div style="background:var(--sur2);padding:10px;border-radius:6px"><b style="text-transform:uppercase;letter-spacing:.05em;font-size:var(--fz-xs);color:var(--txm)">Quarterly Checkpoints</b>';
    ['q1','q2','q3','q4'].forEach(function(qk){
      h += '<div style="margin-top:8px"><label class="q-cul-lbl">'+qk.toUpperCase()+' Focus:</label><textarea class="q-ta" onchange="aSetPriority('+pi+',\''+qk+'\',this.value)"'+(archived?' readonly':'')+'>'+esc(p[qk]||'')+'</textarea></div>';
    });
    h += '</div>';
    h += '</div>';
  });
  h += '</div></div>';

  return h;
}

function _pndRenderAnnualApprovals(person, rec, archived){
  var chain = _pndBuildApprovalChain(state.reportId);
  var cu = currentUser();
  rec.approvals = rec.approvals || {};
  var h = '<div class="q-card"><div class="q-card-hd"><div class="q-t">16. Signature</div><div class="q-m">By signing below, you confirm that the document has been signed and acknowledge that further modifications to the document will no longer be possible.</div>'+
       (!archived ? '<div class="q-actions"><button type="button" class="q-mbtn" onclick="pndEmailSignReminder(\''+state.reportId+'\',\'annual\')" title="Opens Outlook drafted to whoever is next in the chain">Email a reminder</button></div>' : '')+
       '</div><div class="q-card-bd">';
  h += '<div class="q-appr-lead">Sequential approval. A step unlocks when the prior step is signed.</div>';
  var priorSigned = true;
  chain.forEach(function(step, i){
    var appr = rec.approvals[step.key] || { notes:'', signedAt:null, signedBy:null };
    var signed = !!appr.signedAt;
    var isMe = cu && cu.id === step.person.id;
    var unlocked = priorSigned;
    var isCurrent = unlocked && !signed;
    var canSign = unlocked && !signed && isMe && !archived;
    var canEdit = canSign;
    var cls = 'q-appr' + (signed?' signed':'') + (!signed && !unlocked ? ' locked' : '') + (isCurrent?' current':'');
    h += '<div class="'+cls+'"><div class="q-appr-hd"><div class="q-appr-num">'+(signed?_check():String(i+1))+'</div>'+
         '<div class="q-appr-titles"><div class="q-appr-role">'+esc(step.label)+'</div>'+
         '<div class="q-appr-person">'+esc(fullName(step.person))+(step.person.roleLabel?' &middot; <span style="color:var(--txm);font-weight:400">'+esc(step.person.roleLabel)+'</span>':'')+'</div></div></div>';
    var placeholder = canEdit ? 'Add your notes before signing (optional)' : (signed ? '' : 'Notes will appear once '+step.person.first+' completes this step');
    h += '<textarea class="q-appr-notes" '+(canEdit?'':'readonly')+' onchange="aSetApprovalNotes(\''+step.key+'\',this.value)" placeholder="'+escAttr(placeholder)+'">'+esc(appr.notes||'')+'</textarea>';
    h += '<div class="q-appr-foot">';
    if(signed){
      var signerName = appr.signedBy ? (personById(appr.signedBy)?fullName(personById(appr.signedBy)):fullName(step.person)) : fullName(step.person);
      h += '<div class="q-appr-signed">'+_check()+' Signed by '+esc(signerName)+' on '+esc(appr.signedAt.substring(0,10))+'</div>';
    } else if(!unlocked){
      var priorStep = chain[i-1];
      h += '<div class="q-appr-blocked">Waiting on '+esc(priorStep?priorStep.label:'prior step')+' to sign.</div>';
    } else if(isMe){
      h += '<div class="q-appr-unsigned">Ready for your sign-off.</div>';
      h += '<button class="q-appr-btn" onclick="aSignApproval(\''+step.key+'\')">Sign &amp; Approve</button>';
    } else {
      h += '<div class="q-appr-unsigned">Waiting on '+esc(step.person.first)+' to sign.</div>';
    }
    h += '</div></div>';
    priorSigned = signed;
  });
  h += '</div></div>';
  return h;
}

function _aYNMini(key, v){

function _aVal(who, i, cur){

    '<button class="q-val-btn plus'+p+'" onclick="aSetPACellVal(\''+who+'\','+i+',\'+\')">+</button>'+

function _a15(key, v, ri, field){
  /* 1-5 slider-style buttons for Roles & Responsibility scoring */
  var vInt = parseInt(v);
  var h = '<div class="q-scale" style="max-width:200px">';
  for(var i=1;i<=5;i++){
    var tier = i<=2 ? 't1' : i<=3 ? 't2' : 't3';
    var filled = vInt >= i ? ' filled '+tier : '';
    h += '<button class="q-scale-cell'+filled+'" onclick="aSetResp('+ri+',\''+field+'\','+i+')">'+i+'</button>';
  }
  h += '</div>';
  return h;
}
function _a110(key, v){
  var vInt = parseInt(v);
  var h = '<div class="q-scale">';
  for(var i=1;i<=10;i++){
    var tier = i<=3 ? 't1' : i<=6 ? 't2' : 't3';
    var filled = vInt >= i ? ' filled '+tier : '';
    h += '<button class="q-scale-cell'+filled+'" onclick="aSetCulture(\''+key+'\','+i+')">'+i+'</button>';
  }
  h += '</div>';
  return h;
}

function aSetPurpose(v){ var r=getAnnual(); if(r.archivedAt) return; r.purposeText=v; putAnnual(r); }

function aRestorePurpose(){ var r=getAnnual(); if(r.archivedAt) return; r.purposeText=''; putAnnual(r); renderPage(); }
function aSetYN(key, val){
  var r=getAnnual(); if(r.archivedAt) return;
  if(key.indexOf('upwardFeedback.')===0){
    var sub = key.substring('upwardFeedback.'.length);
    r.upwardFeedback[sub] = (r.upwardFeedback[sub]===val) ? null : val;
  } else {
    r[key] = (r[key]===val) ? null : val;
  }

}

function aSetCulture(field, val){ var r=getAnnual(); if(r.archivedAt) return; r.culture = r.culture||{}; r.culture[field]=val; putAnnual(r); renderPage(); }
function aSetDelegate(field, val){ var r=getAnnual(); if(r.archivedAt) return; r.delegate = r.delegate||{}; r.delegate[field]=val; putAnnual(r); }
function aSetPARowName(ri, val){
  var r=getAnnual(); if(r.archivedAt) return;

  while(r.peopleAnalyzerRows.length<=ri) r.peopleAnalyzerRows.push({name:''});

function aSetPACellVal(who, i, val){

function qSignApproval(slotKey){

  if(r.archivedAt) return;                                    /* already archived */
  r.approvals = r.approvals || {};
  r.approvals[slotKey] = r.approvals[slotKey] || { notes:'', signedAt:null, signedBy:null };

  var cu = currentUser();

  putQuarterly(r);
  /* Auto-archive when the whole chain has been signed off. */
  var archived = _pndAutoArchiveIfComplete();
  /* Notify: republish the Home Alert Queue and, if there is a next unsigned
     step, email that person (defensive - no-op if the mail backend is not up). */
  _pndPublishAlerts();
  if(!archived){
    var chain = _pndBuildApprovalChain(state.reportId);
    var currentRec = getQuarterly();
    for(var i=0; i<chain.length; i++){
      var s = chain[i];
      if(!currentRec.approvals[s.key] || !currentRec.approvals[s.key].signedAt){
        _pndSendApprovalEmail(s, state.reportId, state.quarterlyYear, state.quarterlyQ);
        break;
      }
    }
  }
  renderPage();
}

/* KPI drill-through: jump to the Weekly page for that person at the start of the quarter */
function pndOpenWeeklyForQuarter(personId, year, q){
  var qi = parseInt(String(q).replace('Q',''))||1;
  var startMonth = (qi-1)*3;                                   // 0-indexed
  var startD = new Date(year, startMonth, 1);
  var day = startD.getDay();                                   // 0=Sun..6=Sat
  var deltaToMonday = (day===0) ? 1 : (day===1 ? 0 : (8-day)); // roll forward to the first Monday of the quarter
  var monday = new Date(startD.getTime() + deltaToMonday*86400000);
  state.reportId = personId;
  state.weekIso = monday.toISOString().substring(0,10);
  state.page = 'huddle';
  var nav = document.querySelector('.sb-nav');
  if(nav) nav.innerHTML = renderNav();
  renderPage();
}

/* Clears every huddle record for the currently-selected person. No confirm
   prompt - a click on this button is the confirmation. Reserved for testing. */
function pndResetPersonData(){
  var personId = state.reportId;
  if(!personId) return;
  var person = personById(personId);

  try{

/* Load-time hygiene: strip stale `phaseOverride` fields left over from earlier
   builds when the override UI existed. That field is no longer user-settable,
   so any surviving value corrupts activePhaseFor. Runs once per page load. */
(function _pndStripStalePhaseOverride(){
  try{
    var all = _pndLoadHuddles();
    var dirty = false;
    Object.keys(all).forEach(function(k){
      if(all[k] && 'phaseOverride' in all[k]){
        delete all[k].phaseOverride;
        dirty = true;
      }
    });
    if(dirty) _pndSaveHuddles(all);
  }catch(e){}
})();

/* ---- VSP compliance groups modal (Manage-X Configuration Modal Pattern v1) ----
   Membership of the four Performance Points Compliance measurables that P&D
   publishes to VSP. Each group shows the measurable it feeds and its live
   percentage, so the effect of adding or removing someone is visible as it
   happens rather than discovered in VSP next week. People who have not started
   using the module are flagged, since assigning them is safe: they sit outside
   the average until their first entry. */
function openComplianceGroups(){ state.cgOpen = true; renderPage(); }
function closeComplianceGroups(){ state.cgOpen = false; renderPage(); }
function pndToggleComplianceMember(groupId, personId){
  var g = pndComplianceGroups()[groupId];
  if(!g) return;
  var ms = g.members.slice();
  var i = ms.indexOf(personId);
  if(i >= 0) ms.splice(i, 1); else ms.push(personId);
  pndSetComplianceMembers(groupId, ms);                     /* saves + re-emits signals */
  _pndRepaintComplianceGroups();
}
/* Repaint the body only, so the list does not jump while ticking boxes. */
function _pndRepaintComplianceGroups(){
  var host = document.getElementById('cg-body');
  if(host) host.innerHTML = _pndComplianceGroupsBody();
}
function _pndComplianceGroupsBody(){
  try{ _pndWriteComplianceBridge(); }catch(e){}   /* refresh before reading it back */
  var groups = pndComplianceGroups();
  var wk = isoDate(mondayOf(new Date()));
  var roster = people().filter(function(p){ return p.status === 'active'; });
  return Object.keys(groups).map(function(gid){
    var g = groups[gid];
    var live = null, isFinal = false;
    try{ live = window.SMB_PND_COMPLIANCE.liveForWeek(gid, wk); }catch(e){}
    try{ isFinal = window.SMB_PND_COMPLIANCE.isFinal(gid, wk); }catch(e){}
    var pctTxt = (live === null) ? 'no one in scope' : (live + '%');
    var chipCls = (live === null) ? 'c-gry' : (live >= 90 ? 'c-grn' : 'c-red');
    var stateTxt = isFinal ? 'closed' : 'open, still moving';
    var rows = roster.map(function(p){
      var on = g.members.indexOf(p.id) >= 0;
      var started = false;
      try{ started = !!_pndFirstDataWeek(p.id) || !!trackingStartFor(p.id); }catch(e){}
      var hasStd = !!ROLE_STANDARDS[p.roleLabel];
      var hint = !hasStd ? '<span class="cg-hint">no scorecard</span>'

    var queued = '';

               '<span class="cg-lbl">'+esc(g.label)+'</span>'+

             (queued ? '<div class="cg-queue">'+queued+'</div>' : '')+
             '<div class="cg-people">'+rows+'</div>'+

}

/* ---- Coach signal (DoD 11): window.SMB_SIGNALS.pnd ---- */
function emitPndSignals(){
  window.SMB_SIGNALS = window.SMB_SIGNALS || {};
  /* Compliance feed rides every write, not a manual step. */
  _pndInvalidateTrackingCache();
  _pndPublishComplianceFeed();
  _pndWriteComplianceBridge();               /* closed weeks only, read by VSP */
  var reps = myReports();
  var attention=[], exceptions=[], hardFails=0, redWeeks=0, done=0;
  var thisWeek = isoDate(mondayOf(new Date()));
  var all = pdLoad('huddles', {});
  reps.forEach(function(r){
    var key = r.id+'__'+thisWeek;
    var rec = all[key];
    if(!rec){ return; }
    if(rec.away) return;
    var sc = scoreRec(r, rec);
    if(!sc) return;
    done++;
    if(sc.hardFail){
      hardFails++;
      attention.push({id:'hardfail-'+r.id, summary:fullName(r)+' triggered a hard fail this week', suggestedAction:'Open the huddle and start a documented improvement plan'});
    } else if(sc.rag==='red'){
      redWeeks++;
      attention.push({id:'redweek-'+r.id, summary:fullName(r)+' weekly score is '+sc.pct+'% (below target)', suggestedAction:'Review the missed standards in this week\'s huddle'});
    }
  });
  var health = hardFails>0 ? 'red' : (redWeeks>0 ? 'amber' : 'green');
  window.SMB_SIGNALS.pnd = {
    asOf:new Date().toISOString(),
    health:health,
    metrics:{ directReports:reps.length, huddlesDoneThisWeek:done, hardFailsThisWeek:hardFails, redWeeks:redWeeks },
    exceptions:exceptions,
    trends:{ weeklyScoreDelta:null },
    attention:attention
  };
}

/* ============================================================
   P&D CROSS-MODULE READ CONTRACT: window.SMB_PND_HUDDLES (D-98)
   P&D owns the performance record (scorecard entries, weekly scores, the
   Discussed marker, review sign-off state). VSP owns the meeting and agenda.
   VSP's 1:1 agenda consumes this contract to render its "Scorecard review"
   agenda item with live status, badged Source: P&D. P&D is the sole writer.
   All reads are side-effect-free and safe to call when P&D data is absent.
   ============================================================ */
window.SMB_PND_HUDDLES = {
  /* Weekly huddle scorecard status for a person + week.
     Returns { status: 'complete'|'in-progress'|'not-started'|'away'|'no-standard',
               pct: number|null, hardFail: boolean, discussed: boolean,
               discussedAt: iso-string|null } */
  statusFor: function(personId, weekIso){
    try{
      var person = personById(personId);
      if(!person) return { status:'no-standard', pct:null, hardFail:false, discussed:false, discussedAt:null };
      var st = _pndHuddleStatusThisWeek(personId, weekIso);
      if(st==='no-std') return { status:'no-standard', pct:null, hardFail:false, discussed:false, discussedAt:null };
      var all = _pndLoadHuddles();
      var rec = all[personId+'__'+weekIso] || null;
      var pct = null, hardFail = false;
      if(rec && !rec.away){
        var scores = _pndLastNScores(personId, weekIso, 1);
        if(scores.length){ pct = scores[0].pct; hardFail = !!scores[0].hardFail; }
      }
      return {
        status: st,
        pct: pct,
        hardFail: hardFail,
        discussed: !!(rec && rec.discussed),
        discussedAt: (rec && rec.discussedAt) || null
      };
    }catch(e){
      return { status:'not-started', pct:null, hardFail:false, discussed:false, discussedAt:null };
    }
  },
  /* Current-period review state for a person.
     kind: 'quarterly' | 'annual'.
     Returns { period, state: 'complete'|'in-progress'|'not-started',
               scheduledDate: 'YYYY-MM-DD'|null, scheduledTime: 'HH:MM'|null } */
  reviewFor: function(personId, kind){
    try{
      var person = personById(personId);
      if(!person) return null;
      var rs = _pndReviewStatus(person, kind);
      var now = new Date();
      var period = kind==='quarterly' ? (currentYearOf(now)+'-'+currentQuarterOf(now)) : String(currentYearOf(now));
      var rd = getReviewDate(personId, kind, period);
      var stateWord = rs.cls==='c-grn' ? 'complete' : rs.cls==='c-amb' ? 'in-progress' : 'not-started';
      return { period: period, state: stateWord, scheduledDate: rd?rd.date:null, scheduledTime: rd?(rd.time||null):null };
    }catch(e){ return null; }
  }
};

/* ---- Tour Engine v1 (ported from VSP_Module_v10) ----
   Overlay + spotlight + tooltip + Next/Prev/Skip navigation. First-run walkthrough
   is stored per-user in localStorage under `smb_pnd_tours_seen_v1`; the welcome
   card auto-launches once per user and never again. */
window.TOUR_REGISTRY = window.TOUR_REGISTRY || {};

var _tour = { active:false, tourId:null, stepIdx:0, steps:[], resizeHandler:null };

function _pndToursSeenLoad(){
  try{ var raw = localStorage.getItem('smb_pnd_tours_seen_v1'); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
function _pndToursSeenSave(m){ try{ localStorage.setItem('smb_pnd_tours_seen_v1', JSON.stringify(m)); }catch(e){} }
function hasSeenTour(tourId){
  var cu = currentUser(); if(!cu) return false;
  var m = _pndToursSeenLoad(); var seen = m[cu.id] || [];
  return seen.indexOf(tourId) >= 0;
}
function markTourSeen(tourId){
  var cu = currentUser(); if(!cu) return;
  var m = _pndToursSeenLoad(); if(!Array.isArray(m[cu.id])) m[cu.id] = [];
  if(m[cu.id].indexOf(tourId) < 0){ m[cu.id].push(tourId); _pndToursSeenSave(m); }
}
function startTour(tourId){
  var tour = window.TOUR_REGISTRY[tourId];
  if(!tour){ console.warn('Tour not found:', tourId); return; }
  _tour.active = true; _tour.tourId = tourId; _tour.stepIdx = 0; _tour.steps = tour.steps;
  _ensureTourElements();
  _renderTourStep();
  _tour.resizeHandler = function(){ _renderTourStep(); };
  window.addEventListener('resize', _tour.resizeHandler);
}
function nextTourStep(){
  if(_tour.stepIdx < _tour.steps.length - 1){ _tour.stepIdx++; _renderTourStep(); }
  else { endTour(true); }
}
function prevTourStep(){
  if(_tour.stepIdx > 0){ _tour.stepIdx--; _renderTourStep(); }
}
function endTour(completed){
  _tour.active = false;
  if(completed && _tour.tourId) markTourSeen(_tour.tourId);
  ['tour-overlay-top','tour-overlay-bottom','tour-overlay-left','tour-overlay-right','tour-spotlight','tour-tooltip'].forEach(function(id){
    var el = document.getElementById(id); if(el) el.parentNode.removeChild(el);
  });
  if(_tour.resizeHandler){ window.removeEventListener('resize', _tour.resizeHandler); _tour.resizeHandler = null; }
  _tour.tourId = null; _tour.steps = []; _tour.stepIdx = 0;
}
function _ensureTourElements(){
  if(document.getElementById('tour-tooltip')) return;
  ['tour-overlay-top','tour-overlay-bottom','tour-overlay-left','tour-overlay-right'].forEach(function(id){
    var d = document.createElement('div'); d.id = id; d.className = 'tour-overlay'; document.body.appendChild(d);
  });
  var sp = document.createElement('div'); sp.id = 'tour-spotlight'; sp.className = 'tour-spotlight'; document.body.appendChild(sp);
  var tt = document.createElement('div'); tt.id = 'tour-tooltip'; tt.className = 'tour-tooltip'; document.body.appendChild(tt);
}
function _renderTourStep(){
  var step = _tour.steps[_tour.stepIdx]; if(!step) return;
  var run = function(){
    var target = step.target ? document.querySelector(step.target) : null;
    var overlayT = document.getElementById('tour-overlay-top');
    var overlayB = document.getElementById('tour-overlay-bottom');
    var overlayL = document.getElementById('tour-overlay-left');
    var overlayR = document.getElementById('tour-overlay-right');
    var spotlight = document.getElementById('tour-spotlight');
    var tooltip = document.getElementById('tour-tooltip');
    var proceed = function(){
      var rect;
      if(target){
        rect = target.getBoundingClientRect();
        var pad = 6;
        var top = Math.max(0, rect.top - pad);
        var left = Math.max(0, rect.left - pad);
        var right = Math.min(window.innerWidth, rect.right + pad);
        var bottom = Math.min(window.innerHeight, rect.bottom + pad);
        overlayT.style.cssText = 'top:0;left:0;width:100%;height:'+top+'px';
        overlayB.style.cssText = 'top:'+bottom+'px;left:0;width:100%;height:'+Math.max(0,window.innerHeight-bottom)+'px';
        overlayL.style.cssText = 'top:'+top+'px;left:0;width:'+left+'px;height:'+(bottom-top)+'px';
        overlayR.style.cssText = 'top:'+top+'px;left:'+right+'px;width:'+Math.max(0,window.innerWidth-right)+'px;height:'+(bottom-top)+'px';
        spotlight.style.cssText = 'top:'+top+'px;left:'+left+'px;width:'+(right-left)+'px;height:'+(bottom-top)+'px;display:block';
      } else {
        overlayT.style.cssText = 'top:0;left:0;width:100%;height:100%';
        overlayB.style.cssText = 'display:none';
        overlayL.style.cssText = 'display:none';
        overlayR.style.cssText = 'display:none';
        spotlight.style.display = 'none';
      }
      var total = _tour.steps.length, idx = _tour.stepIdx, isFirst = idx===0, isLast = idx===total-1;
      tooltip.innerHTML =
        '<div class="tour-progress-bar"><div class="tour-progress-fill" style="width:'+((idx+1)/total*100)+'%"></div></div>'+
        '<div class="tour-tt-content">'+
          '<div class="tour-tt-step">Step '+(idx+1)+' of '+total+'</div>'+
          '<h3 class="tour-tt-title">'+esc(step.title)+'</h3>'+
          '<div class="tour-tt-body">'+step.body+'</div>'+
        '</div>'+
        '<div class="tour-tt-footer">'+
          '<button type="button" class="tour-skip" onclick="endTour(true)">Skip tour</button>'+
          '<div class="tour-nav-btns">'+
            (!isFirst ? '<button type="button" class="tour-btn tour-btn-ghost" onclick="prevTourStep()">Back</button>' : '')+
            '<button type="button" class="tour-btn tour-btn-primary" onclick="nextTourStep()">'+(isLast?'Finish':'Next')+'</button>'+
          '</div>'+
        '</div>';
      tooltip.style.display = 'block';
      _positionTooltip(target, step.position||'auto', tooltip);
    };
    if(target){
      var preRect = target.getBoundingClientRect();
      var isVisible = preRect.top >= 0 && preRect.bottom <= window.innerHeight;
      if(!isVisible){ target.scrollIntoView({behavior:'smooth', block:'center'}); setTimeout(proceed, 300); }
      else { proceed(); }
    } else { proceed(); }
  };
  if(step.onBefore){
    try{ step.onBefore(); }catch(e){ console.warn('Tour onBefore error:', e); }
    setTimeout(run, 150);
  } else { run(); }
}
function _positionTooltip(target, position, tooltip){
  var tt = tooltip;
  tt.style.left = '50%'; tt.style.top = '50%'; tt.style.transform = 'translate(-50%,-50%)'; tt.removeAttribute('data-pos');
  if(!target){ tt.setAttribute('data-pos','center'); return; }
  var ttRect = tt.getBoundingClientRect();
  var rect = target.getBoundingClientRect();
  var margin = 14;
  var pos = position;
  if(pos === 'auto'){
    if(rect.right + margin + ttRect.width <= window.innerWidth) pos = 'right';
    else if(rect.left - margin - ttRect.width >= 0) pos = 'left';
    else if(rect.bottom + margin + ttRect.height <= window.innerHeight) pos = 'bottom';
    else pos = 'top';
  }
  var top, left;
  if(pos === 'right'){ top = rect.top + rect.height/2 - ttRect.height/2; left = rect.right + margin; }
  else if(pos === 'left'){ top = rect.top + rect.height/2 - ttRect.height/2; left = rect.left - ttRect.width - margin; }
  else if(pos === 'top'){ top = rect.top - ttRect.height - margin; left = rect.left + rect.width/2 - ttRect.width/2; }
  else if(pos === 'bottom'){ top = rect.bottom + margin; left = rect.left + rect.width/2 - ttRect.width/2; }
  else { tt.setAttribute('data-pos','center'); return; }
  top = Math.max(10, Math.min(window.innerHeight - ttRect.height - 10, top));
  left = Math.max(10, Math.min(window.innerWidth - ttRect.width - 10, left));
  tt.style.left = left + 'px'; tt.style.top = top + 'px'; tt.style.transform = 'none';
  tt.setAttribute('data-pos', pos);
}

var PND_DEVICE_USER_KEY = 'smb_pnd_device_user';

  try{ return localStorage.getItem(PND_DEVICE_USER_KEY) || null; }catch(e){ return null; }
}
function _pndSetDeviceUser(personId){
  try{ localStorage.setItem(PND_DEVICE_USER_KEY, personId); }catch(e){}
  if(!window.SMB_TENANT) window.SMB_TENANT = {};
  var p = personById(personId);
  window.SMB_TENANT.currentUser = p
    ? { personId:p.id, initials:p.initials, name:fullName(p) }
    : { personId:personId };
}
/* Apply the stored identity. Runs before the first render so scoping,
   visible pages, and the lock all resolve for the right person. */
function _pndApplyDeviceUser(){
  var id = _pndDeviceUser();
  if(id && personById(id)){ _pndSetDeviceUser(id); return true; }
  return false;
}

function fmtVal(v, unit){
  // Format a value by its unit type so the unit is always visible:
  //   $  -> '$' + thousands-separated number (up to 2 decimals)
  //   %  -> number + '%'
  //   #  -> thousands-separated number (up to 2 decimals)
  //   YN -> 'Yes' / 'No' (passed through as-is)
  if(v===null||v===undefined||v==='')return '-';
  if(unit==='YN')return typeof v==='number'?v+'%':v; // 'Yes'/'No' cells pass through; numeric Yes-rate -> percent
  if(typeof v==='string'){
    var pn=Number(v);
    if(isNaN(pn))return v; // genuine text, leave alone
    v=pn;
  }
  var n=Number(v);
  if(isNaN(n))return String(v);
  var num=n.toLocaleString('en-US',{maximumFractionDigits:2});
  if(unit==='h'){ var _tm=Math.round(n); if(_tm<60) return _tm+'m'; var _th=Math.floor(_tm/60), _tmm=_tm%60; return _th+'h'+(_tmm?' '+_tmm+'m':''); } // Time stored as minutes
  if(unit==='$')return '$'+num;
  if(unit==='%')return num+'%';
  return num; // '#' and any other numeric unit
}

function isOnTrack(m,val){
  if(m.goalType==="\u2265")return Number(val)>=Number(m.goal);
  if(m.goalType==="\u2264")return Number(val)<=Number(m.goal);
  if(m.goalType===">")return Number(val)>Number(m.goal);
  if(m.goalType==="<")return Number(val)<Number(m.goal);
  if(m.goalType==="inside"){ var _lo=Number(m.goalMin),_hi=Number(m.goalMax),_x=Number(val); return _x>=_lo&&_x<=_hi; }
  if(m.goalType==="outside"){ var _lo2=Number(m.goalMin),_hi2=Number(m.goalMax),_x2=Number(val); return _x2<_lo2||_x2>_hi2; }
  return String(val)===String(m.goal);
}

function _scTier(m,val){
  if(val===null||val===undefined||val==='')return null;
  if(m && m.unit==='YN'){
    if(typeof val==='string'){ var s=val.trim().toLowerCase(); if(s==='')return null; return (s==='yes'||s==='y'||s==='true'||s==='1')?'green':'red'; }
    var p=Number(val); if(!isFinite(p))return null; return p>=95?'green':p>=85?'amber':'red';
  }
  if(m && (m.goalType==='inside'||m.goalType==='outside')){
    var _lo=Number(m.goalMin),_hi=Number(m.goalMax),_x=Number(val);
    if(!isFinite(_lo)||!isFinite(_hi)||!isFinite(_x))return 'red';
    if(m.goalType==='inside'){ return (_x>=_lo&&_x<=_hi)?'green':'red'; }
    return (_x<_lo||_x>_hi)?'green':'red';
  }
  if(isOnTrack(m,val))return 'green';
  var v=Number(val), g=Number(m.goal);
  if(!isFinite(v)||!isFinite(g))return 'red';
  if(g===0)return 'red';
  var w=m.watch;
  if(w!==undefined&&w!==null&&w!==''){
    w=Number(w);
    if(w<=g)return v>=w?'amber':'red';
    return v<=w?'amber':'red';
  }
  var band=Math.abs(g)*0.1;
  if(m.goalType==='\u2265'||m.goalType==='>')return v>=g-band?'amber':'red';
  if(m.goalType==='\u2264'||m.goalType==='<')return v<=g+band?'amber':'red';
  return Math.abs(v-g)<=band?'amber':'red';
}

function _tierColor(t){return t==='green'?'#16a34a':t==='amber'?'#b45309':t==='red'?'#dc2626':'var(--txm)';}
function _scCellBg(h,strong,val){
  if(strong)return h==='green'?'#dcfce7':h==='amber'?'#fde68a':'#fee2e2';
  if(h==='green')return '#f0fdf4';
  if(val===null||val===undefined||val===0)return 'transparent';
  return h==='amber'?'#fefce8':'#fff1f1';
}

}

function _goalLabel(m){
  if(m.goalType==='inside') return fmtVal(m.goalMin,m.unit)+'-'+fmtVal(m.goalMax,m.unit);
  if(m.goalType==='outside') return 'out '+fmtVal(m.goalMin,m.unit)+'-'+fmtVal(m.goalMax,m.unit);
  return (m.goalType||'')+fmtVal(m.goal,m.unit);
}

function _metricLatest(m){
  if(!m||!m.readings) return null;
  for(var i=m.readings.length-1;i>=0;i--){ if(m.readings[i]!==null&&m.readings[i]!==undefined) return m.readings[i]; }
  return null;
}

function _scRollupVal(m){
  var a=_scMetricAggs(m);
  return (m && m.rollupAs==='Total') ? a.tot : a.avg;
}
