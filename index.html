/* === SMB CANON v2.2 BEGIN === DO NOT EDIT - change canon source instead === */
:root {
  /* ─── Type scale (locked) ────────────────────────────────────────── */
  --fz-xs:    11px;
  --fz-sm:    12px;
  --fz-md:    13px;
  --fz-base:  14px;
  --fz-body:  15px;
  --fz-lg:    16px;
  --fz-xl:    20px;
  --fz-2xl:   22px;
  --fz-3xl:   30px;
  --fz-4xl:   30px;

  /* ─── Status palette (reserved for health indicators ONLY) ───────── */
  --grn:   #16a34a;   --grnb: #dcfce7;   --grnt: #15803d;
  --amb:   #fbbf24;   --ambb: #fef3c7;   --ambt: #92400e;
  --red:   #dc2626;   --redb: #fee2e2;   --redt: #991b1b;

  /* ─── Text palette ───────────────────────────────────────────────── */
  --txt:   #0f172a;
  --txb:   #334155;
  --txm:   #64748b;
  --txd:   #677082;

  /* ─── Surface palette ────────────────────────────────────────────── */
  --bg:    #f1f5f9;
  --sur:   #ffffff;
  --sur2:  #f8fafc;
  --brd:   #e2e8f0;
  --brd2:  #cbd5e1;

  /* ─── Action palette ─────────────────────────────────────────────── */
  --blu:   #2563eb;   --blub: #dbeafe;   --blut: #1e40af;

  /* ─── Brand palette ──────────────────────────────────────────────── */
  --sb:    #1e2d3a;
  --gp:    #C9A33E;

  /* ─── Progression palette (pipeline stages, lifecycle journeys) ──── */
  --pg-slate:   #94a3b8;
  --pg-sky:     #7dd3fc;
  --pg-blue:    #38bdf8;
  --pg-indigo:  #3b82f6;
  --pg-violet:  #6366f1;
  --pg-teal:    #8b5cf6;
  --pg-done:    #15803d;

  /* ─── Category palette (parallel groupings - sources, types) ─────── */
  --cat-pnk:    #ec4899;
  --cat-cyn:    #06b6d4;
  --cat-vio:    #8b5cf6;
  --cat-ind:    #6366f1;
  --cat-tea:    #14b8a6;
  --cat-bro:    #b45309;
  --cat-slate:  #475569;

  /* ─── Overlays ───────────────────────────────────────────────────── */
  --overlay-light-06: rgba(255,255,255,0.06);
  --overlay-light-08: rgba(255,255,255,0.08);
  --overlay-dark-04:  rgba(0,0,0,0.04);
}

/* Status chip canon + Shared Tag Pill v1.
   .chip (Standards v2.32 / D-85) and .tag (Standards v2.36 / D-100) share the same locked
   silhouette: rounded 12px pill, 1px border, inline-flex, weight 600. Only the colour source
   differs. .chip pulls from the status palette via .c-<color> semantic modifiers below; .tag
   pulls from the Category palette (--cat-*) or the Progression palette (--pg-*) at application
   time. No module hand-rolls a different pill shape - no squared tags, no per-module radius,
   no inline raw-hex on pill classes.
   Status semantics locked (v2.32 Status Chip Canon v1):
   - c-red   = overdue / expired / off-track / below-market / decline
   - c-amb   = due soon / expiring within 90 days / at-risk / above-market / watch
   - c-grn   = current / valid / on-track / at-market / proceed
   - c-blu   = info / neutral / category / stage-in-progress
   - c-gry   = no data / N/A / not on file
   VSP_Module_v8.html is the visual reference for chips.
   VSP status chips + Company category tag = reference for shared pill silhouette. */
.chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:12px;font-weight:600;font-size:var(--fz-base);white-space:nowrap;border:1px solid transparent}
.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:12px;font-weight:600;font-size:var(--fz-body);white-space:nowrap;border:1px solid transparent}
.c-grn{background:var(--grnb);color:var(--grnt);border-color:var(--grn)}
.c-amb{background:var(--ambb);color:var(--ambt);border-color:var(--amb)}
.c-red{background:var(--redb);color:var(--redt);border-color:var(--red)}
.c-blu{background:var(--blub);color:var(--blut);border-color:var(--blu)}
.c-gry{background:var(--sur2);color:var(--txm);border-color:var(--brd)}

/* ═══════════════════════════════════════════════════════════════════════
   TYPOGRAPHY ROLES (v2.0 - May 20, 2026)
   Five roles. Hero numbers, page title, card title - everything else 15px.
   Reference implementation: CRM_Module.html v1.55+
   ═══════════════════════════════════════════════════════════════════════ */

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--txt);
  font-size: var(--fz-body);
  line-height: 1.5;
}

/* Role 1: Page title (30px) */
.pg-title {
  font-size: var(--fz-3xl);
  font-weight: 700;
  color: var(--txt);
  line-height: 1.2;
  letter-spacing: -0.01em;
}
.pg-sub {
  font-size: var(--fz-body);
  color: var(--txm);
  margin-top: 4px;
}

/* Role 2: Hero number (20-28px) + its tiny paired label (10px) */
.pulse-n { font-size: var(--fz-2xl); font-weight: 700; color: var(--txt); line-height: 1; letter-spacing: -0.01em; }
.pulse-l { font-size: var(--fz-xs); color: var(--txm); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.kpi-val { font-size: var(--fz-4xl); font-weight: 700; color: var(--txt); line-height: 1; }
.kpi-lbl { font-size: var(--fz-xs); color: var(--txm); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.stat-n  { font-size: var(--fz-xl); font-weight: 700; color: var(--txt); line-height: 1; }
.stat-l  { font-size: var(--fz-xs); color: var(--txm); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.rec-name { font-size: var(--fz-xl); font-weight: 700; color: var(--txt); }

/* Role 3: Card title + modal title (16px) */
.card-title { font-size: var(--fz-lg); font-weight: 600; color: var(--txt); }
.smb-modal-title { font-size: var(--fz-lg); font-weight: 700; color: var(--txt); }

/* Role 4: Body (15px - container-scoped; content classes inherit) */
.card-body { padding: 16px; font-size: var(--fz-body); line-height: 1.5; }
.tbl-wrap { font-size: var(--fz-body); line-height: 1.5; overflow-x: auto; }
.card-body table td, .tbl-wrap table td { font-size: inherit; }

/* Role 5: ALL chrome at body size (15px). Includes table headers,
   buttons, sidebar, topbar, form labels and inputs, badges and pills.
   The collapse Dave finalized May 20: visual hierarchy comes from
   weight (400/500/600/700) and case (UPPERCASE), not from size. */

/* Table headers */
table th, .card-body table th, .tbl-wrap table th {
  font-size: var(--fz-body); font-weight: 600; color: var(--txm);
  text-transform: uppercase; letter-spacing: 0.04em;
}

/* Section / info-block titles (uppercase 15px) */
.sec, .smb-form-section-title, .ib-title {
  font-size: var(--fz-body); font-weight: 700; color: var(--txm);
  text-transform: uppercase; letter-spacing: 0.07em;
}

/* Field labels (sentence-case 15px) */
.ir-l, .fl { font-size: var(--fz-body); color: var(--txm); font-weight: 500; }

/* Buttons */
.btn { font-size: var(--fz-body); font-weight: 600; }
.btn-sm { font-size: var(--fz-body); font-weight: 600; }
.coach-btn, .coach-ask-btn, .research-btn { font-size: var(--fz-body); font-weight: 600; }

/* Pills, badges, status indicators */
.pill, .chip, .badge, .score-badge, .pref-badge { font-size: var(--fz-body); font-weight: 600; }
.rh, .stag { font-size: var(--fz-body); font-weight: 600; }

/* Sidebar */
.sb-group-hd, .sb-children button, .mod-btn, .child-btn, .nav-item { font-size: var(--fz-body); font-weight: 600; }
.sb-sub { font-size: var(--fz-body); color: var(--txd); }
.sb-name { font-size: var(--fz-body); font-weight: 600; }
.sb-section-lbl { font-size: var(--fz-body); font-weight: 700; color: var(--txm); text-transform: uppercase; letter-spacing: 0.07em; }

/* Topbar */
.tb-search input, .tb-switch, .tb-user-name, .tb-logout { font-size: var(--fz-body); }
.tb-title { font-size: var(--fz-body); font-weight: 600; }
.tb-org-name { font-size: var(--fz-body); font-weight: 600; }
.tb-org-sub { font-size: var(--fz-body); color: var(--txm); }

/* Mini-bar (Records/Active/Pipeline/Overdue summary) */
.mini-bar { font-size: var(--fz-body); }
.ms { font-size: var(--fz-body); color: var(--txm); }

/* Modal form fields */
.smb-modal-sub { font-size: var(--fz-body); color: var(--txm); }
.smb-fld label { font-size: var(--fz-body); font-weight: 600; }
.smb-fld input[type=text], .smb-fld input[type=email], .smb-fld input[type=tel],
.smb-fld input[type=date], .smb-fld input[type=number],
.smb-fld select, .smb-fld textarea { font-size: var(--fz-body); font-family: inherit; }
.smb-fld-check { font-size: var(--fz-body); }
.textarea { font-size: var(--fz-body); font-family: inherit; }
.sec-div { font-size: var(--fz-body); font-weight: 700; color: var(--txm); text-transform: uppercase; letter-spacing: 0.07em; }

/* Period bar / year selector / view-toggle */
.period-bar, .pb, .year-select, .crm-view-toggle button { font-size: var(--fz-body); }

/* Filter bar inputs and selects */
.filter-bar input, .filter-bar select { font-size: var(--fz-body); font-family: inherit; }

/* Back link, layout reset link, page subtitle */
.back-link, .layout-reset-link { font-size: var(--fz-body); }

/* Activity timeline meta */
.act-meta { font-size: var(--fz-body); color: var(--txd); }

/* Role 6: Visual indicators ONLY (true micro - paired with dots,
   bars, avatars, or kanban density). NOT for chrome or labels. */
.tb-user-av, .avatar,
.f-bf, .src-ex, .fc-bf,
.tour-tt-step, .tmi-meta,
.kb-card-meta, .kb-card-foot, .kb-card-init,
.kb-col-hd-count, .kb-col-hd-val, .kb-empty,
.st-lbl, .dr-badge,
.settings-note {
  font-size: var(--fz-xs);
}
.settings-note { color: var(--txd); font-style: italic; }

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible,
[role="button"]:focus-visible,

/* SMB Components v1 (Standards v2.38 / D-102).
   One locked source of truth for shared UI components, extracted from
   VSP_Module_v22: buttons, cards, page titles, tabs, filter bar inputs, and
   the Goals-list row. Every module pastes this block after the SMB CANON and
   SMB SHELL CHROME blocks. Byte-checked by audit Section P against
   COMPONENTS_SHA256.

   Chrome-model resolution. This block adopts VSP's inline dark titles as the
   canonical rendering: .pg-title renders inline at --fz-3xl; .card-title stays
   dark on neutral card headers. Modules that previously hid .pg-title in favor
   of a topbar page title, or whitened .card-title on coloured card headers,
   drop those overrides on the v1 sweep and adopt this block's rendering.

   Goals-list row. The .goal-row class set is the extracted form of VSP v22
   goalRow() inline styles. Cosmetics live in classes; state-dependent choices
   are expressed via modifier classes (.off, .cancelled, .done, .muted,
   .on-track, .all-done, .last). Per-value inline styles remain inline (progress
   bar width percentage; menu positioning); shared cosmetics do not.

   Not included at v1. .smb-empty (VSP v22 does not carry it as a distinct
   class set; deferred to a future revision when VSP adopts an empty-state
   component). Modules keep their current empty states until then.

   --module-accent stays a per-module :root token (each module picks its own
   restrained hue; VSP #5b8fd6 is the reference). This block does not lock
   --module-accent because the token exists to differentiate modules; it locks
   --btn-txt because button text colour is a component property. */

:root {
  --btn-txt: #374151;
}

/* PAGE HEADER */
.pg-title{font-size:var(--fz-3xl);font-weight:700;margin-bottom:4px;letter-spacing:-.01em;color:var(--txt)}
.pg-sub{color:var(--txm);margin-bottom:20px}

/* CARDS */
.card{background:var(--sur);border:1px solid var(--brd);border-radius:8px;padding:16px;margin-bottom:14px}
.card-body{padding:16px;font-size:var(--fz-lg);line-height:1.5}
.card-title{font-size:var(--fz-lg);font-weight:600;color:var(--txt)}

/* TABS */
.tab-bar{display:flex;border-bottom:2px solid var(--brd);margin-bottom:16px}
.tab{padding:8px 18px;font-size:var(--fz-md);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--txm);margin-bottom:-2px;font-weight:500;font-family:inherit}
.tab.active{color:var(--blu);border-bottom-color:var(--blu);font-weight:600}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:var(--fz-body);font-weight:600;cursor:pointer;border:1px solid var(--brd);background:var(--sur);color:var(--btn-txt);font-family:inherit;transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--sur2)}
.btn-sm{padding:6px 12px}
.btn-primary,.btn-gold{background:var(--gp);color:#fff;border-color:var(--gp)}
.btn-primary:hover,.btn-gold:hover{background:var(--gpd);border-color:var(--gpd)}
.btn-blu{background:var(--blu);color:#fff;border-color:var(--blu)}
.btn-blu:hover{background:var(--bluh);border-color:var(--bluh)}
.btn-red{background:var(--redb);color:var(--red);border-color:var(--reds)}

/* FILTER BAR */
.filter-bar input,.filter-bar select{font-size:var(--fz-body);font-family:inherit}

/* GOALS-LIST ROW (implements Goals Row Status Tint v1 from Standards v2.37) */
.goal-row{background:var(--sur);border-bottom:0.5px solid var(--brd)}
.goal-row.last{border-bottom:none}
.goal-row.off{background:var(--redb);border-left:3px solid var(--red)}
.goal-row.cancelled{background:var(--sur2)}
.goal-row-main{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.goal-title{flex:1;min-width:0;font-size:var(--fz-lg);font-weight:500;color:var(--txt);cursor:pointer}
.goal-title.off{color:var(--red)}
.goal-title.muted{color:var(--txm)}
.goal-title.done{text-decoration:line-through}
.goal-ms{font-size:var(--fz-lg);color:var(--txm);white-space:nowrap;min-width:70px;text-align:right}
.goal-ms.all-done{color:var(--grn)}
.goal-progress{display:flex;align-items:center;gap:5px;min-width:80px;cursor:pointer}
.goal-progress-bar{flex:1;height:5px;background:var(--brd);border-radius:3px;min-width:44px}
.goal-progress-fill{height:100%;border-radius:3px;transition:width .2s}
.goal-progress-fill.on-track{background:var(--grn)}
.goal-progress-fill.off-track{background:var(--red)}
.goal-progress-fill.done{background:var(--blu)}
.goal-progress-fill.cancelled{background:var(--txm)}
.goal-due{font-size:var(--fz-lg);color:var(--txm);white-space:nowrap;min-width:44px;text-align:right}
.goal-status-select{width:98px;font-size:var(--fz-base);padding:3px 5px;border-width:1.5px;border-style:solid;border-radius:5px;font-weight:500;cursor:pointer;font-family:inherit}
.goal-status-select.on-track{background:var(--grnb);color:var(--grnt);border-color:var(--grn)}
.goal-status-select.off-track{background:var(--redb);color:var(--redt);border-color:var(--red)}
.goal-status-select.done{background:var(--blub);color:var(--blut);border-color:var(--blu)}
.goal-status-select.cancelled{background:var(--sur2);color:var(--txm);border-color:var(--brd)}
.goal-ctx{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;color:var(--txm);font-size:var(--fz-lg)}
.goal-ctx.open{background:var(--sur2)}
.goal-ctx-menu{position:fixed;background:var(--sur);border:1px solid var(--brd);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.15);z-index:9000;min-width:220px;padding:4px 0}
.goal-expand{padding:0 14px 12px 36px;background:var(--sur2);border-top:0.5px solid var(--brd)}
/* === SMB COMPONENTS v1 END === */

/* ---- Module tokens (P&D). Raw hex/rgba in a module :root is the sanctioned
   pattern, same as CRM/HR. Everything else references tokens. ---- */
:root{
  --sb-line:#2d3f52;
  --sb-gold-accent:#f0d895;
  --module-accent:#6b8e5a;      /* P&D = muted sage. Growth/development semantic. Distinct from VSP blue #5b8fd6, CRM rust #c0663f, BD purple #8a6fb8, HR teal #3f9d8a. Warmer-neutral so it does not compete with status chip greens/reds on the page. */
  --r-card:8px;
  --r-input:6px;
  --r-pill:999px;
  --bluh:#1d4ed8;               /* action blue hover - SMB Components v1 companion (verified vs ESign/Marketing in mount) */
  --reds:#fca5a5;               /* red soft border   - SMB Components v1 companion (verified vs ESign/Marketing in mount) */
  --overlay-light-04:rgba(255,255,255,.04);
  --overlay-dark-45:rgba(15,23,42,.45);
  --p-ink:#000;
  --p-paper:#fff;
  --p-tint:#f4f4f4;
  --p-line:#666;
  --p-line-strong:#000;
  --p-text-muted:#333;
  --grn-brd:#86efac;
  --red-brd:#fca5a5;
  --amb-brd:#fcd34d;
  --blu-brd:#93c5fd;
  --cat-pnkb:#fce7f3;
  --cat-teab:#ccfbf1;
  --cat-indb:#e0e7ff;
}


/* ---- Layout ---- */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.page{padding:22px 26px;font-size:var(--fz-lg)}   /* Content Rhythm v1 root (Section H) */
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h .pg-sub{max-width:640px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---- Buttons ----
   .btn / .btn:hover / .btn-sm / .btn-gold(+hover) / .btn-blu(+hover) / .btn-red
   removed per the v2.38 SMB Components v1 sweep - the locked block owns them.
   .btn-ghost and .link-btn are P&D-local (not in the block) and stay. ---- */
.btn-ghost{background:transparent}
.link-btn{background:none;border:none;color:var(--blu);cursor:pointer;font-family:inherit;font-size:var(--fz-body);font-weight:600;padding:0}

/* ---- Selectors ---- */
.field{display:flex;flex-direction:column;gap:4px}
.field label{color:var(--txm);font-weight:600;font-size:var(--fz-body)}
.sel,.inp{height:34px;padding:0 10px;border:1px solid var(--brd);border-radius:var(--r-input);background:var(--sur);color:var(--txt);font-family:inherit;font-size:var(--fz-body)}
.sel:focus,.inp:focus{border-color:var(--blu);outline:none}
.wk{display:flex;align-items:center;gap:8px}
.wk .wklabel{font-weight:700;color:var(--txt);min-width:210px;text-align:center}

/* ---- Avatar ---- */
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fz-xs);flex-shrink:0}

/* ---- Away banner ---- */
.away-note{background:var(--ambb);border:1px solid var(--amb-brd);color:var(--ambt);padding:10px 14px;border-radius:var(--r-input);margin-bottom:14px;font-weight:600}

/* ---- Score summary tiles ---- */
.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.score-tile{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-card);padding:14px 16px;position:relative;overflow:hidden}
.score-tile::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--brd2)}
.score-tile.t-yes::before{background:var(--grn)}
.score-tile.t-no::before{background:var(--red)}
.score-tile.t-score.rag-grn::before{background:var(--grn)}
.score-tile.t-score.rag-amb::before{background:var(--amb)}
.score-tile.t-score.rag-red::before{background:var(--red)}
.score-tile .stat-n{margin-bottom:4px}
.score-tile.t-score.rag-grn .stat-n{color:var(--grnt)}
.score-tile.t-score.rag-amb .stat-n{color:var(--ambt)}
.score-tile.t-score.rag-red .stat-n{color:var(--redt)}

/* ---- Hard-fail banner ---- */
.hf-banner{background:var(--redb);border:1px solid var(--red-brd);color:var(--redt);padding:12px 16px;border-radius:var(--r-input);margin-top:12px;font-weight:600}
.hf-banner .hf-tag{display:inline-block;background:var(--red);color:#fff;border-radius:var(--r-pill);padding:2px 9px;font-size:var(--fz-sm);font-weight:700;margin-right:8px;text-transform:uppercase;letter-spacing:.04em}
.hf-pass{background:var(--grnb);border:1px solid var(--grn-brd);color:var(--grnt);padding:12px 16px;border-radius:var(--r-input);margin-top:12px;font-weight:600}

/* ---- Scorecard table ---- */
.sc-wrap{overflow-x:auto}
.sc{width:100%;border-collapse:collapse;font-size:var(--fz-body)}
.sc th{text-align:left;padding:9px 12px;background:var(--sur2);border-bottom:1px solid var(--brd);color:var(--txm);text-transform:uppercase;letter-spacing:.04em;font-weight:600;font-size:var(--fz-body)}
.sc th.c-yn{width:74px;text-align:center}
.sc td{padding:10px 12px;border-bottom:1px solid var(--brd);vertical-align:top}
.sc tr.sec-row td{background:var(--bg);font-weight:700;color:var(--txm);text-transform:uppercase;letter-spacing:.05em;font-size:var(--fz-body);padding:7px 12px}
.sc tr.hard td{background:var(--ambb)}
.sc-std{font-size:var(--fz-lg);color:var(--txt);font-weight:500;line-height:1.35}
.sc-deadline{font-size:var(--fz-base);color:var(--txd);margin-top:3px}
.sc-hardtag{display:inline-block;background:var(--red);color:#fff;border-radius:var(--r-pill);padding:1px 8px;font-size:var(--fz-sm);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:.04em;vertical-align:middle}
.sc td.c-yn{text-align:center}
.yn{display:inline-flex;border:1px solid var(--brd);border-radius:var(--r-input);overflow:hidden}
.yn-btn{border:none;background:var(--sur);color:var(--txm);padding:5px 10px;cursor:pointer;font-family:inherit;font-weight:600;font-size:var(--fz-body);line-height:1}
.yn-btn+.yn-btn{border-left:1px solid var(--brd)}
.yn-btn.yes.on{background:var(--grnb);color:var(--grnt)}
.yn-btn.no.on{background:var(--redb);color:var(--redt)}

/* =============== QUARTERLY PAGE MODULE CSS =============== */
/* Meta strip (Person / Quarter / Year controls under page title) */
.q-meta{display:flex;gap:20px;align-items:center;padding:14px 18px;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-card);margin-bottom:20px}
.q-meta .field{margin:0;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.q-meta label{font-weight:700;color:var(--txm);font-size:var(--fz-xs);text-transform:uppercase;letter-spacing:.05em;margin:0}
.q-meta select{border:1px solid var(--brd);background:var(--sur);padding:6px 12px;border-radius:6px;font-family:inherit;font-size:var(--fz-body);color:var(--txt);cursor:pointer;min-width:80px}
.q-meta .autosave{margin-left:auto;color:var(--txm);font-size:var(--fz-xs);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* Quarterly page card frame - matches VSP's section-card rhythm */
.q-card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-card);margin-bottom:20px;overflow:hidden}
.q-card-hd{padding:16px 20px;border-bottom:1px solid var(--brd);background:var(--sur2);border-left:4px solid var(--module-accent);position:relative}
.q-card-hd .q-t{font-size:var(--fz-lg);font-weight:700;color:var(--txt);text-transform:uppercase;letter-spacing:.04em}
.q-card-hd .q-m{color:var(--txm);font-size:var(--fz-body);font-weight:400;margin-top:2px;line-height:1.35}
.q-card-hd .q-actions{margin-top:10px;display:flex;gap:8px}
.q-card-bd{padding:20px;font-size:var(--fz-lg)}

/* Rollup KPI grid - real .kpi-card with drill-through */
.q-rollup{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

/* YN status pill pair - uses status canon */
.q-yn{display:inline-flex;gap:6px;align-items:center}
.q-yn-btn{padding:7px 18px;border:1px solid var(--brd);background:var(--sur);color:var(--txm);border-radius:999px;cursor:pointer;font-family:inherit;font-size:var(--fz-body);font-weight:600;transition:background 120ms,color 120ms,border-color 120ms;min-width:64px;text-align:center}
.q-yn-btn:hover{background:var(--sur2)}
.q-yn-btn.yes.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.q-yn-btn.no.on{background:var(--red);color:#fff;border-color:var(--red)}

/* YN mini for grid cells (Seat Fit u/w/c) */
.q-ynm{display:inline-flex;gap:3px;align-items:center;justify-content:center}
.q-ynm-btn{padding:4px 10px;border:1px solid var(--brd);background:var(--sur);color:var(--txm);border-radius:6px;cursor:pointer;font-family:inherit;font-size:var(--fz-xs);font-weight:700;min-width:28px}
.q-ynm-btn.yes.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.q-ynm-btn.no.on{background:var(--red);color:#fff;border-color:var(--red)}

/* Value rating pill trio (+ / +/- / -) */
.q-val{display:inline-flex;gap:3px;align-items:center;justify-content:center}
.q-val-btn{min-width:38px;padding:4px 8px;border:1px solid var(--brd);background:var(--sur);color:var(--txm);border-radius:6px;cursor:pointer;font-family:inherit;font-size:var(--fz-body);font-weight:700;text-align:center}
.q-val-btn.plus.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.q-val-btn.half.on{background:var(--amb);color:#fff;border-color:var(--amb)}
.q-val-btn.minus.on{background:var(--red);color:#fff;border-color:var(--red)}

/* Quarterly Goals - card with status border-left */
.q-goal{background:var(--sur);border:1px solid var(--brd);border-left:4px solid var(--brd);border-radius:6px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:32px 1fr auto auto;gap:12px;align-items:center}
.q-goal.done{border-left-color:var(--grn)}
.q-goal.ontrack{border-left-color:var(--grn)}
.q-goal.offtrack{border-left-color:var(--red)}
.q-goal-num{width:28px;height:28px;border-radius:50%;background:var(--sur2);color:var(--txm);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fz-body)}
.q-goal-text{border:none;background:transparent;font-family:inherit;font-size:var(--fz-lg);color:var(--txt);width:100%;padding:4px 0;line-height:1.4}
.q-goal-text:focus{outline:none;border-bottom:1px solid var(--blu)}
/* q-goal-select is the interactive Quarterly Goals status dropdown - a <select>,
   not a chip. It borrows chip color modifiers (.c-grn / .c-red / .c-blu / .c-gry)
   from the canon for background/border tinting; the select-specific chrome
   (padding, cursor, arrow) lives here. */
.q-goal-select{padding:5px 12px;border-radius:12px;font-size:var(--fz-xs);font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border:1px solid var(--brd);background:var(--sur);color:var(--txm);font-family:inherit;cursor:pointer;flex-shrink:0}
.q-goal-select:disabled{opacity:.6;cursor:not-allowed}
/* Chip color modifiers cascade the same tint onto the select background/border
   so it visually matches the status chip vocabulary without pretending to be
   a chip element (Section N flags .chip without a .c-* modifier, not the reverse). */
.q-goal-select.c-grn{background:var(--grnb);color:var(--grnt);border-color:var(--grn)}
.q-goal-select.c-red{background:var(--redb);color:var(--redt);border-color:var(--red)}
.q-goal-select.c-blu{background:var(--blub);color:var(--blut);border-color:var(--blu)}
.q-goal-x{border:none;background:transparent;color:var(--txm);cursor:pointer;font-size:var(--fz-xl);padding:0 4px}
.q-goal-x:hover{color:var(--red)}
.q-add-goal{width:100%;padding:14px;border:2px dashed var(--brd);background:transparent;border-radius:6px;cursor:pointer;font-family:inherit;font-size:var(--fz-body);font-weight:600;color:var(--txm);text-align:center}
.q-add-goal:hover{border-color:var(--blu);color:var(--blu);background:var(--sur2)}

/* Purpose statement */
.q-purpose{padding:20px 24px;background:var(--sur2);border-radius:8px;border-left:3px solid var(--blu);font-size:var(--fz-lg);color:var(--txt);margin-bottom:16px;line-height:1.5;font-style:italic}

/* Core values list */
.q-cv-list{list-style:none;padding:0;margin:0 0 16px}
.q-cv-item{padding:12px 16px;background:var(--sur2);border-radius:6px;margin-bottom:8px;font-size:var(--fz-lg);color:var(--txt);display:flex;align-items:center;gap:12px}
.q-cv-num{width:26px;height:26px;border-radius:50%;background:var(--blu);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fz-body);flex-shrink:0}
/* VSP-mirror goal row - matches Core Values row treatment (numbered blue circle) plus editable status */
.q-vsp-goal{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sur2);border-radius:6px;margin-bottom:8px}
.q-vsp-goal-text{flex:1;font-size:var(--fz-lg);color:var(--txt);line-height:1.4}
/* Measurables mirror status uses the canon .chip / .c-* classes directly.
   The old .q-vsp-goal-status class is retired; see .q-goal-select above for
   the interactive dropdown counterpart. */
/* Measurables table - VSP-mirror layout */
.q-meas-tbl{width:100%;border-collapse:collapse;font-size:var(--fz-body)}
.q-meas-tbl th{padding:10px 8px;text-align:center;background:var(--sur2);border-bottom:1px solid var(--brd);font-size:var(--fz-xs);text-transform:uppercase;letter-spacing:.04em;color:var(--txm);font-weight:700;white-space:nowrap}
.q-meas-tbl td{padding:12px 8px;border-bottom:1px solid var(--brd);text-align:center;color:var(--txt)}
.q-meas-tbl td:first-child{text-align:left}
.q-meas-tbl tbody tr:hover{background:var(--sur2)}

/* Embrace question - shared bottom-of-section prompt */
.q-embrace{display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--sur);border:1px solid var(--brd);border-radius:6px;margin-top:4px}
.q-embrace-q{font-weight:600;color:var(--txt);font-size:var(--fz-lg)}

/* Values & Seat Fit table */
.q-vf{width:100%;border-collapse:separate;border-spacing:0}
.q-vf th{text-align:center;font-weight:700;color:var(--txm);padding:12px 8px;border-bottom:2px solid var(--brd);font-size:var(--fz-xs);text-transform:uppercase;letter-spacing:.05em}
.q-vf th.first{text-align:left;padding-left:0}
.q-vf td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--brd)}
.q-vf td.first{text-align:left;padding-left:0}
.q-vf .q-person{font-weight:600;color:var(--txt);font-size:var(--fz-lg)}
.q-vf .q-role{color:var(--txm);font-size:var(--fz-xs);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:2px}
.q-vf-help{font-size:var(--fz-body);color:var(--txm);margin-bottom:14px;line-height:1.5}

/* Roles & Responsibilities */
.q-role-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;padding:12px 14px;background:var(--sur2);border-radius:6px;border:1px solid var(--brd)}
.q-role-num{width:24px;color:var(--txm);font-weight:700;font-size:var(--fz-body);padding-top:4px;flex-shrink:0}
.q-role-input{flex:1;border:none;background:transparent;font-family:inherit;font-size:var(--fz-lg);color:var(--txt);resize:none;min-height:24px;line-height:1.4}
.q-role-input:focus{outline:none}

/* Upward Feedback table */
.q-uf{width:100%}
.q-uf-row{display:grid;grid-template-columns:32px 1fr auto;gap:14px;align-items:center;padding:12px 14px;background:var(--sur2);border-radius:6px;margin-bottom:8px;border:1px solid var(--brd)}
.q-uf-num{color:var(--txm);font-weight:700;font-size:var(--fz-body)}
.q-uf-q{font-size:var(--fz-lg);color:var(--txt);font-weight:500}

/* Quarterly Conversation */
.q-convo-item{background:var(--sur);border:1px solid var(--brd);border-radius:8px;padding:18px;margin-bottom:14px}
.q-convo-q{font-size:var(--fz-lg);font-weight:600;color:var(--txt);margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;line-height:1.4}
.q-convo-num{width:28px;height:28px;border-radius:50%;background:var(--blu);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fz-body);flex-shrink:0}

/* 1-10 scale as progression cell strip */
.q-scale{display:flex;gap:4px;align-items:center;margin-top:6px}
.q-scale-cell{flex:1;min-height:38px;border:1px solid var(--brd);background:var(--sur);color:var(--txm);cursor:pointer;font-family:inherit;font-size:var(--fz-body);font-weight:700;display:inline-flex;align-items:center;justify-content:center;transition:transform 100ms,border-color 100ms;border-radius:5px}
.q-scale-cell:hover{transform:translateY(-1px);border-color:var(--blu)}
.q-scale-cell.filled{color:#fff;border-color:transparent}
.q-scale-cell.filled.t1{background:var(--red)}
.q-scale-cell.filled.t2{background:var(--amb)}
.q-scale-cell.filled.t3{background:var(--grn)}

/* Culture & satisfaction grid */
.q-cul-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.q-cul-lbl{display:block;font-size:var(--fz-body);color:var(--txm);font-weight:600;margin-bottom:8px;line-height:1.5}
.q-cul-imp-lbl{display:block;font-size:var(--fz-body);color:var(--txm);font-weight:600;margin:16px 0 6px}

/* Delegate & Elevate reference (muted) */
.q-de{background:var(--sur2);border:1px solid var(--brd);border-radius:8px;padding:18px}
.q-de-note{font-size:var(--fz-body);color:var(--txm);margin-bottom:14px;font-style:italic}
.q-de-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.q-de-item label{display:block;font-size:var(--fz-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--txm);font-weight:700;margin-bottom:6px}
.q-de-item-val{padding:12px 14px;background:var(--sur);border:1px solid var(--brd);border-radius:6px;min-height:40px;font-size:var(--fz-body);color:var(--txt);line-height:1.4}

/* Notes - role-scoped tabs */
.q-notes-tabs{display:flex;gap:2px;border-bottom:1px solid var(--brd);margin-bottom:14px}
.q-notes-tab{padding:10px 16px;border:none;background:transparent;color:var(--txm);font-family:inherit;font-size:var(--fz-body);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.04em}
.q-notes-tab:hover{color:var(--txt)}
.q-notes-tab.active{color:var(--blu);border-bottom-color:var(--blu)}

/* Approval chain - sequential sign-off cards */
.q-appr-lead{font-size:var(--fz-body);color:var(--txm);margin-bottom:14px;line-height:1.5}
.q-appr{background:var(--sur);border:1px solid var(--brd);border-left:4px solid var(--brd);border-radius:8px;padding:16px 20px;margin-bottom:12px;transition:opacity 120ms,background 120ms,border-color 120ms}
.q-appr.locked{opacity:.5}
.q-appr.signed{border-left-color:var(--grn);background:var(--sur2)}
.q-appr.current{border-left-color:var(--module-accent)}
.q-appr-hd{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.q-appr-num{width:34px;height:34px;border-radius:50%;background:var(--sur2);color:var(--txm);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fz-lg);flex-shrink:0}
.q-appr.signed .q-appr-num{background:var(--grn);color:#fff}
.q-appr.signed .q-appr-num svg{width:18px;height:18px}
.q-appr.current .q-appr-num{background:var(--module-accent);color:#fff}
.q-appr-titles{flex:1;min-width:0}
.q-appr-role{font-size:var(--fz-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--txm);font-weight:700;line-height:1}
.q-appr-person{font-size:var(--fz-lg);font-weight:600;color:var(--txt);margin-top:4px;line-height:1.2}
.q-appr-notes{width:100%;border:1px solid var(--brd);background:var(--sur);border-radius:6px;padding:10px 12px;font-family:inherit;font-size:var(--fz-body);color:var(--txt);resize:vertical;min-height:70px;line-height:1.5;box-sizing:border-box;margin-bottom:12px}
.q-appr-notes:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.q-appr-notes[readonly]{background:var(--sur2);cursor:default}
.q-appr-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;flex-wrap:wrap}
.q-appr-signed{color:var(--grn);font-size:var(--fz-body);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.q-appr-signed svg{width:18px;height:18px}
.q-appr-unsigned{color:var(--txm);font-size:var(--fz-body);font-style:italic;display:inline-flex;align-items:center;gap:6px}
.q-appr-blocked{color:var(--txd);font-size:var(--fz-body);font-style:italic}
.q-appr-btn{padding:9px 22px;border:1px solid var(--module-accent);background:var(--module-accent);color:#fff;border-radius:6px;font-family:inherit;font-size:var(--fz-body);font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;transition:opacity 100ms}
.q-appr-btn:hover{opacity:.9}
.q-appr-btn:disabled{background:var(--sur2);color:var(--txd);border-color:var(--brd);cursor:not-allowed;opacity:1}

/* Meta strip action buttons */
.q-meta-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-mbtn{padding:7px 14px;border:1px solid var(--brd);background:var(--sur);color:var(--txt);border-radius:6px;font-family:inherit;font-size:var(--fz-body);font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background 100ms,border-color 100ms}
.q-mbtn:hover{background:var(--sur2);border-color:var(--blu)}
.q-mbtn-file{cursor:pointer}
.q-mbtn-pending{border-style:dashed;color:var(--txm)}
.q-mbtn-pending:hover{border-color:var(--amb);color:var(--amb)}
.q-mbtn-danger{color:var(--red);border-color:var(--red)}
.q-mbtn-danger:hover{background:var(--redb)}

/* Source badge on card titles */
.q-src{display:inline-block;padding:2px 7px;font-size:var(--fz-xs);font-weight:700;border-radius:4px;text-transform:none;letter-spacing:.03em;margin-left:8px;vertical-align:middle;line-height:1.35;text-transform:uppercase}
.q-src-vsp{background:var(--blu);color:#fff}
.q-src-hr{background:var(--gp);color:#fff}

/* Override badge on card titles */
.q-ovr-badge{display:inline-block;padding:2px 8px;font-size:var(--fz-xs);font-weight:700;border-radius:4px;letter-spacing:.05em;margin-left:6px;vertical-align:middle;line-height:1.35;text-transform:uppercase;background:var(--ambb);color:var(--ambt);border:1px solid var(--amb)}

/* Pulled-source reference card (shows what VSP/HR has) */
.q-ref{background:var(--sur2);border:1px solid var(--brd);border-radius:6px;padding:14px 16px;margin-bottom:14px}
.q-ref-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.q-ref-lbl{font-size:var(--fz-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--txm);font-weight:700}
.q-ref-body{color:var(--txt);font-size:var(--fz-body);line-height:1.5}
.q-ref-list{list-style:none;margin:0;padding:0;color:var(--txt)}
.q-ref-list li{padding:6px 0;font-size:var(--fz-body);border-bottom:1px dashed var(--brd)}
.q-ref-list li:last-child{border-bottom:none}
.q-ref-btn{padding:6px 12px;border:1px solid var(--blu);background:var(--sur);color:var(--blu);border-radius:6px;font-family:inherit;font-size:var(--fz-xs);font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.q-ref-btn:hover{background:var(--blu);color:#fff}

/* Override warning banner (shown when local value differs from pulled) */
.q-warn{padding:10px 14px;background:var(--ambb);border:1px solid var(--amb);border-radius:6px;color:var(--ambt);font-size:var(--fz-body);margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.q-warn-msg{display:flex;align-items:center;gap:8px}
.q-warn-icon{font-size:var(--fz-lg)}
.q-restore-btn{padding:5px 12px;border:1px solid var(--ambt);background:transparent;color:var(--ambt);border-radius:6px;font-family:inherit;font-size:var(--fz-xs);font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.q-restore-btn:hover{background:var(--ambt);color:var(--ambb)}

/* Editable Purpose input (replaces static quote card) */
.q-purpose-input{width:100%;padding:16px 20px;background:var(--sur2);border:1px solid var(--brd);border-left:3px solid var(--module-accent);border-radius:8px;font-family:inherit;font-size:var(--fz-lg);color:var(--txt);line-height:1.5;resize:vertical;min-height:80px;box-sizing:border-box;font-style:italic;margin-bottom:14px}
.q-purpose-input:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.q-purpose-input::placeholder{color:var(--txm);font-style:italic}

/* Editable Core Values list */
.q-cv-editable{margin-bottom:16px}
.q-cv-editable .q-cv-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--sur2);border:1px solid var(--brd);border-radius:6px;margin-bottom:6px}
.q-cv-input{flex:1;border:none;background:transparent;font-family:inherit;font-size:var(--fz-lg);color:var(--txt);padding:2px 0}
.q-cv-input:focus{outline:none;border-bottom:1px solid var(--blu)}

/* Number badges - all use module accent for consistent brand identity */
.q-cv-num,.q-convo-num,.q-goal-num{background:var(--module-accent);color:#fff}

/* Sign-as dev switcher (visible only when SMB_DEV_MODE = true) */
.q-signas{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border:1px dashed var(--module-accent);border-radius:6px;background:var(--sur)}
.q-signas-lbl{font-size:var(--fz-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--module-accent);font-weight:700}
.q-signas select{border:none;background:transparent;font-family:inherit;font-size:var(--fz-body);color:var(--txt);cursor:pointer;padding:2px 4px}
.q-signas select:focus{outline:none}

/* You-are indicator (dev-only) */
.q-youare{padding:8px 14px;background:var(--sur2);border:1px solid var(--brd);border-left:4px solid var(--module-accent);border-radius:6px;color:var(--txt);font-size:var(--fz-body);margin-bottom:20px}
.q-youare b{color:var(--module-accent)}

/* Awaiting-your-sign-off preview - mirrors the Home Alert Queue for the current user */
.q-inbox{background:var(--sur);border:1px solid var(--brd);border-left:4px solid var(--amb);border-radius:8px;margin-bottom:20px;overflow:hidden}
.q-inbox-hd{padding:12px 18px;background:var(--ambb);color:var(--ambt);font-size:var(--fz-body);font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--brd)}
.q-inbox-count{background:var(--amb);color:#fff;padding:2px 10px;border-radius:12px;font-size:var(--fz-xs);font-weight:700}
.q-inbox-list{list-style:none;padding:0;margin:0}
.q-inbox-item{padding:14px 18px;border-bottom:1px solid var(--brd);cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:background 100ms}
.q-inbox-item:last-child{border-bottom:none}
.q-inbox-item:hover{background:var(--sur2)}
.q-inbox-title{font-size:var(--fz-lg);font-weight:600;color:var(--txt)}
.q-inbox-body{font-size:var(--fz-body);color:var(--txm)}

/* Archived banner */
.q-archived-banner{margin-bottom:16px;padding:14px 18px;background:var(--grnb);border:1px solid var(--grn);border-radius:8px}
.q-archived-hd{display:flex;align-items:center;gap:12px;color:var(--grnt);font-size:var(--fz-body);font-weight:600}
.q-archived-hd svg{width:18px;height:18px}
.q-archived-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:var(--grn);color:#fff;border-radius:4px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:var(--fz-xs)}
.q-archived-cta{margin-top:10px;display:flex;justify-content:flex-end}
.q-arch-next-btn{background:var(--module-accent);color:#fff;border:none;border-radius:6px;padding:9px 16px;font-family:inherit;font-size:var(--fz-body);font-weight:600;cursor:pointer}
.q-arch-next-btn:hover{filter:brightness(0.92)}
/* Signature progress bar - top-of-page status widget */
.q-sig-progress{margin:0 0 16px;padding:12px 16px;background:var(--sur);border:1px solid var(--brd);border-radius:8px;display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;cursor:pointer;transition:background .12s}
.q-sig-progress:hover{background:var(--sur2)}
.q-sig-bar-wrap{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.q-sig-bar-fill{height:100%;background:var(--module-accent);transition:width .3s}
.q-sig-dots{display:flex;gap:6px}
.q-sig-dot{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:var(--fz-xs);font-weight:700;background:var(--sur2);color:var(--txm);border:1.5px solid var(--brd)}
.q-sig-dot.signed{background:var(--grnb);color:var(--grnt);border-color:var(--grn)}
.q-sig-dot.pending{background:var(--sur2);color:var(--txm);border-color:var(--brd)}
.q-sig-lbl{font-size:var(--fz-body);color:var(--txb);font-weight:600;white-space:nowrap}

/* ═══ DASHBOARD ═══ */
.dash-card{background:var(--sur);border:1px solid var(--brd);border-radius:8px;margin-bottom:16px;overflow:hidden}
.dash-card-hd{padding:14px 20px;background:var(--sur2);border-bottom:1px solid var(--brd);display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dash-t{font-size:var(--fz-lg);font-weight:700;color:var(--txt);margin:0}
.dash-m{font-size:var(--fz-body);color:var(--txm)}
.dash-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 8px;background:var(--module-accent);color:#fff;border-radius:12px;font-size:var(--fz-xs);font-weight:700;margin-left:8px}
.dash-card-bd{padding:16px 20px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.dash-person-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sur);border:1px solid var(--brd);border-radius:6px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .12s,border-color .12s}
.dash-person-btn:hover{background:var(--sur2);border-color:var(--module-accent)}
.dash-person-btn.dash-me{cursor:pointer;background:var(--sur2)}
.dash-person-avatar{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:var(--fz-body);font-weight:700;color:#fff;flex-shrink:0}
.dash-person-body{flex:1;min-width:0}
.dash-person-name{font-size:var(--fz-body);font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-person-role{font-size:var(--fz-sm);color:var(--txm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-trend-list{display:flex;flex-direction:column;gap:6px}
/* dash-kpi: VSP KPI-card treatment for the score-trend grid. Left accent bar
   carries the tone (t-grn / t-amb / t-red), big value, WoW delta, sparkline. */
.dash-kpi{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--sur);border:1px solid var(--brd);border-left:4px solid var(--brd);border-radius:6px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .12s,border-color .12s}
.dash-kpi:hover{background:var(--sur2)}
.dash-kpi.t-grn{border-left-color:var(--grn)}
.dash-kpi.t-amb{border-left-color:var(--amb)}
.dash-kpi.t-red{border-left-color:var(--red)}
.dash-kpi-empty{border-left-color:var(--brd);opacity:.85}
.dash-kpi-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dash-kpi-name{font-size:var(--fz-body);font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-kpi-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.dash-kpi-val{font-size:var(--fz-4xl);font-weight:700;color:var(--txt);line-height:1}
.dash-kpi-spark{display:inline-flex;align-items:flex-end}
.dash-kpi-bot{display:flex}
.dash-kpi-delta{font-size:var(--fz-sm);font-weight:600}
.dash-kpi-delta.up{color:var(--grnt)}
.dash-kpi-delta.down{color:var(--redt)}
.dash-kpi-delta.flat{color:var(--txm)}
.dash-kpi-cta{font-size:var(--fz-body);color:var(--module-accent);font-weight:600}
/* Huddle-week indicator on the Weekly Huddle meta strip */
.pd-cad-note{margin-top:12px;padding:8px 12px;border-radius:6px;font-size:var(--fz-body);font-weight:500}
.pd-cad-note.is-huddle{background:var(--grnb);color:var(--grnt);border:1px solid var(--grn)}
.pd-cad-note.off-week{background:var(--sur2);color:var(--txm);border:1px solid var(--brd)}
/* Weekly Scorecard Lock v1 */
.pd-lock-note{display:flex;align-items:flex-start;gap:10px;margin:0 0 12px;padding:12px 16px;border-radius:8px;font-size:var(--fz-body);line-height:1.45}
.pd-lock-note.is-locked{background:var(--redb);color:var(--redt);border:1px solid var(--red)}
.pd-lock-note.is-admin{background:var(--ambb);color:var(--ambt);border:1px solid var(--amb)}
.pd-lock-ico{flex:none;font-size:var(--fz-lg);line-height:1.2}
.pd-lock-trail{margin:-6px 0 12px;padding:6px 16px;font-size:var(--fz-sm);color:var(--txm);font-style:italic}
/* Cadence tag next to person name on dashboard huddle cards */
.dash-person-cad{display:inline-block;margin-left:8px;padding:1px 7px;background:var(--sur2);color:var(--txm);border:1px solid var(--brd);border-radius:10px;font-size:var(--fz-xs);font-weight:600;vertical-align:middle}
.dash-person-offweek{opacity:.72}
.dash-person-missed{margin-top:3px;font-size:var(--fz-xs);font-weight:700;color:var(--redt)}
/* Device User v1 picker */
.pnd-who-wrap{position:fixed;inset:0;z-index:9998;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.pnd-who-card{background:var(--sur);border:1px solid var(--brd);border-radius:12px;max-width:460px;width:100%;max-height:86vh;overflow:auto;padding:22px 22px 16px;box-shadow:0 18px 48px rgba(15,23,42,.28)}
.pnd-who-hd{font-size:var(--fz-lg);font-weight:700;color:var(--txt);margin-bottom:4px}
.pnd-who-sub{font-size:var(--fz-body);color:var(--txm);margin-bottom:16px;line-height:1.45}
.pnd-who-list{display:flex;flex-direction:column;gap:6px}
.pnd-who-row{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--brd);border-radius:8px;background:var(--sur);cursor:pointer;text-align:left;font-family:inherit;width:100%}
.pnd-who-row:hover{border-color:var(--blu);background:var(--sur2)}
.pnd-who-av{width:32px;height:32px;border-radius:50%;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:var(--fz-body)}
.pnd-who-txt{display:flex;flex-direction:column;line-height:1.3}
.pnd-who-name{font-size:var(--fz-body);font-weight:600;color:var(--txt)}
.pnd-who-role{font-size:var(--fz-sm);color:var(--txm)}
.dash-person-offweek:hover{opacity:1}
/* Upcoming reviews list */
.dash-rev-list{display:flex;flex-direction:column;gap:6px}
.dash-rev-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--brd)}
.dash-rev-row:last-child{border-bottom:0}
.dash-rev-name{font-size:var(--fz-body);color:var(--txt);font-weight:500}
.dash-rev-cell{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 6px;border-radius:6px}
.dash-rev-cell:hover{background:var(--sur2)}
.dash-rev-lbl{font-size:var(--fz-sm);color:var(--txm);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
/* Review scheduling card */
.q-schedule .q-sched-row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.q-sched-actions{display:flex;gap:8px;align-items:center}
.q-sched-set{margin-top:12px;font-size:var(--fz-body);color:var(--grnt);font-weight:600}
.q-int-badge{display:inline-block;margin-left:6px;padding:1px 6px;background:var(--ambb);color:var(--ambt);border:1px solid var(--amb);border-radius:8px;font-size:var(--fz-xs);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
/* Meta-strip More overflow menu */
.q-more-wrap{position:relative;display:inline-block}
.q-more-menu{display:none;position:absolute;right:0;top:calc(100% + 4px);min-width:180px;background:var(--sur);border:1px solid var(--brd);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.14);z-index:30;overflow:hidden}
.q-more-menu.open{display:block}
.q-more-item{display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;font-family:inherit;font-size:var(--fz-body);color:var(--txt);cursor:pointer}
.q-more-item:hover{background:var(--sur2)}
.q-more-file{cursor:pointer}
/* Weekly Discussed marker */
.pd-discussed{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--brd);border-radius:6px;background:var(--sur);cursor:pointer;font-size:var(--fz-body);color:var(--txm);white-space:nowrap}
.pd-discussed.is-done{background:var(--grnb);border-color:var(--grn);color:var(--grnt);font-weight:600}
.pd-discussed input{cursor:pointer;margin:0}
/* VSP meeting-context note + synced cadence display */
.pd-meeting-note{margin-top:12px;padding:8px 12px;border-radius:6px;background:var(--sur2);border:1px solid var(--brd);font-size:var(--fz-body);color:var(--txb)}
.pd-meeting-note .q-src{margin-right:6px}
.pd-cad-locked{padding:7px 12px;border:1px solid var(--brd);border-radius:6px;background:var(--sur2);font-size:var(--fz-body);color:var(--txm);white-space:nowrap}
/* Purpose + values banner inside the Purpose, Core Values & Seat Fit section */
.q-vf-purpose{margin:0 0 4px;padding:10px 14px;background:var(--sur2);border:1px solid var(--brd);border-radius:6px;font-size:var(--fz-body);color:var(--txt);line-height:1.45}
.q-vf-purpose-lbl{display:inline-block;margin-right:8px;font-size:var(--fz-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--module-accent)}

/* ============================================================
   Performance & Development (P&D) - SMB module
   Single-file vanilla JS. Reads people from window.BOSHR when
   HR is loaded; falls back to a LIDA seed so it runs standalone.
   Writes P&D state to localStorage under smb_perf_*.
   ============================================================ */

var MODULE_ID = 'pnd';
var STORE_VER = 'v1';

/* ---- AI Integration v1 ---- */
var TEST_MODE_AI = true;
var AI_PROXY_URL = '';
async function callAI(kind, params){
  if(TEST_MODE_AI){
    if(kind==='huddleSummary'){
      return {summary:'Huddle summary stub. Weekly score '+((params&&params.pct)||0)+'%. Test mode.'};
    }
    return {kind:kind, ok:true, stub:true, summary:'AI stub.'};
  }
  if(AI_PROXY_URL){
    var r = await fetch(AI_PROXY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:kind,params:params})});
    return await r.json();
  }
  throw new Error('AI proxy not configured');
}

/* ---- Tenant ---- */
window.SMB_TENANT = window.SMB_TENANT || {
  tenantId:'lida-001', orgName:'Lida Homes', orgInitial:'L',
  tagline:'Custom homes & renovations',
  currentUser:{personId:'p1', initials:'DS', name:'Dave Stephens'}
};

/* ---- Storage (guarded for opaque origin) ---- */
function pdLoad(key, fallback){
  try{ var v = localStorage.getItem('smb_perf_'+key+'_'+STORE_VER); return v==null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function pdSave(key, val){
  try{ localStorage.setItem('smb_perf_'+key+'_'+STORE_VER, JSON.stringify(val)); }catch(e){}
}

function people(){
  if(window.BOSHR && typeof window.BOSHR.getAll==='function'){
    try{
      return window.BOSHR.getAll().map(function(p){
        return {
          id:p.id, first:p.first, last:p.last, initials:p.initials,

/* Reports the current supervisor can run huddles for.
   Owner/HR see everyone; a supervisor sees their reports; a plain user sees none. */
/* ---- Access model (locked 2026-07-05, placeholder pending HR wire-up) ----
   HR is the source of truth for reportsTo via window.BOSHR.getAll().
   Every P&D page (Weekly Huddle, Quarterly, Annual) uses the SAME scope:
     - employee:   sees own artifacts only
     - supervisor: sees own + direct reports (reportsTo === self.id)
     - admin:      sees everyone (hr flag OR President/Owner role)
   The transitive walk (manager-of-manager sees the subtree) is deferred; direct
   reports only for now. When HR ships with a live BOSHR.getAll() surface, no
   change is needed here - people() already prefers BOSHR when present. */
function pdAccessMode(){
  var cu = currentUser();
  if(!cu) return 'employee';
  /* Admin: President, Owner, HR. Sees everyone. */
  if(cu.hr || cu.roleLabel==='President' || cu.roleLabel==='Owner') return 'admin';
  if(cu.supervisor) return 'supervisor';
  return 'employee';
}
/* All active people whose reports-to chain leads back to rootId. Used to give
   supervisors visibility into their entire subtree, not just direct reports. */
function _pdDescendants(rootId){
  var all = people().filter(function(p){return p.status==='active';});
  var out = [];
  var queue = [rootId];
  var seen = {};
  while(queue.length){
    var pid = queue.shift();
    if(seen[pid]) continue;
    seen[pid] = true;
    all.forEach(function(p){
      if(p.reportsTo === pid){
        out.push(p);
        queue.push(p.id);
      }
    });
  }
  return out;
}
function pdVisiblePeople(){
  var cu = currentUser();
  if(!cu) return [];
  var all = people().filter(function(p){return p.status==='active';});
  var mode = pdAccessMode();
  if(mode==='admin') return all;                                                   /* everyone */
  if(mode==='supervisor'){
    var self = all.filter(function(p){return p.id===cu.id;});
    var subtree = _pdDescendants(cu.id);                                           /* recursive: reports + their reports + ... */
    return self.concat(subtree);
  }
  return all.filter(function(p){return p.id===cu.id;});                            /* employee: self only */
}
function myReports(){                                                              /* legacy alias; returns visible people */
  return pdVisiblePeople();
}
function currentUser(){
  var cid = (window.SMB_TENANT && window.SMB_TENANT.currentUser && window.SMB_TENANT.currentUser.personId) || 'p1';
  return personById(cid) || people()[0] || null;
}
function canSeeSupervisorPages(){                                                  /* everyone gets access; scope filters what they see */
  var cu = currentUser();
  return !!cu;
}

/* ============================================================
   MEETING CADENCE (per-role) - D-97
   The scorecard is always weekly: every week gets filled and scored. Cadence
   controls only the MEETING rhythm - which weeks a huddle is scheduled, and the
   dashboard's "due this week" logic. It never changes score math or the grid.
   Values: 'weekly' | 'biweekly' | 'monthly'. LIDA seed: biweekly default,
   Foreman monthly. Persisted per tenant; admin-editable from the meta strip.
   Biweekly anchor = first Monday of the current year, so all biweekly roles
   share one rhythm. Monthly = the first Monday of each month.
   ============================================================ */
/* Storage Version Policy v1: module-level data-model version. Bumps ONLY on a
   true breaking key/shape change; user data is never wiped by a bump. The
   staging adapter also uses it to refuse cross-version cloud loads/overwrites. */
var PD_STORAGE_VERSION = 1;
var CADENCE_STORAGE_VERSION = 1;
var ROLE_CADENCE_DEFAULT = {
  'Foreman': 'monthly'
  /* every other role falls through to LIDA_CADENCE_FALLBACK */
};
var LIDA_CADENCE_FALLBACK = 'biweekly';                       /* LIDA runs biweekly; system-wide default for a fresh tenant would be 'weekly' */

function _pndLoadCadence(){
  try{
    var raw = localStorage.getItem('smb_pnd_cadence_v1');
    if(raw){ var o = JSON.parse(raw); if(o && o.map) return o.map; }
  }catch(e){}
  /* Seed from defaults on first load */
  return Object.assign({}, ROLE_CADENCE_DEFAULT);
}
function _pndSaveCadence(map){
  try{ localStorage.setItem('smb_pnd_cadence_v1', JSON.stringify({v:CADENCE_STORAGE_VERSION, map:map})); }catch(e){}
}
function cadenceForRole(roleLabel){
  var map = _pndLoadCadence();
  if(map && map[roleLabel]) return map[roleLabel];
  if(ROLE_CADENCE_DEFAULT[roleLabel]) return ROLE_CADENCE_DEFAULT[roleLabel];
  return LIDA_CADENCE_FALLBACK;
}
function setCadenceForRole(roleLabel, cadence){
  var map = _pndLoadCadence();
  map[roleLabel] = cadence;
  _pndSaveCadence(map);
}
/* Effective cadence for a PERSON. The VSP meeting contract wins when live (VSP
   owns meetings; the huddle is one agenda item in the person's 1:1 - D-98
   direction). ROLE_CADENCE is the fallback when VSP is not mounted or has no
   meeting for the person. Returns { cadence, source: 'VSP'|'local', meeting }. */
function cadenceForPerson(person){
  if(!person) return { cadence: LIDA_CADENCE_FALLBACK, source: 'local', meeting: null };
  var mr = _pndReadVspMeeting(person.id);
  if(mr.source === 'VSP' && mr.meeting && mr.meeting.cadence){
    return { cadence: mr.meeting.cadence, source: 'VSP', meeting: mr.meeting };
  }
  return { cadence: cadenceForRole(person.roleLabel), source: 'local', meeting: null };
}

/* First Monday of a given year - the biweekly anchor. */
function _firstMondayOfYear(year){
  var d = new Date(year, 0, 1);
  var day = d.getDay();                                       /* 0 Sun .. 6 Sat */
  var offset = (day===1) ? 0 : ((8 - day) % 7);

  /* Check for per-week override in that week's huddle record */
  try{

    if(rec && rec.phaseOverride && rec.phaseOverride>=1 && rec.phaseOverride<=4) return rec.phaseOverride;
  }catch(e){}

  if(!iso) return 1;

/* Which week of the calendar month is a given ISO Monday in?
   Returns 1 for the first Monday of that month, 2 for the second, etc.
   Weeks with a fifth Monday map to 5 - callers clamp to 4 as needed.
   Parses the ISO string manually so we do not go through new Date(iso), which

   day for any local timezone west of UTC. */

  if(day < firstMondayDate) return 1;                       /* Monday belongs to prior month tail */

/* RAG thresholds on the weekly score (percent). Judgment defaults; tune later. */
var RAG_GREEN = 90, RAG_AMBER = 75;

/* ---- Week helpers (ISO Monday key) ---- */

/* ---- State ---- */
var state = {

  reportId:null,

/* ============================================================
   WEEKLY SCORECARD LOCK v1 (D-110) + LOCK TIERS v1
   A scorecard week is completed after the week ends. The week starting
   Monday covers Mon-Sun and stays open into the following week; the day it
   closes depends on how much of the company the person runs, because the
   people above wait on the people below before their own numbers are real.
     Company    locks end of the following WEDNESDAY  (week start + 9 days)
     Division   locks end of the following TUESDAY    (week start + 8 days)
     Individual locks end of the following MONDAY     (week start + 7 days)
   Tier is derived from the org chart, not hardcoded: the highest person
   carrying a weekly scorecard is Company, their direct reports are Division,
   everyone deeper is Individual. An admin can override per person.
   Once locked, every Yes/No cell and the Away toggle become read-only for
   the person and their supervisor.

   0% per D-94, Away weeks stay excluded. Away locks with everything else,
   so a missed week cannot be retroactively excused.

    var nx = personById(cur.reportsTo);

    cur = nx; d++;
    if(d > 20) break;                                       /* cycle guard */
  }
  return d;
}
/* Depth of the highest person who actually carries a weekly scorecard. Under
   LIDA that is the VP of Construction, because the President has no weekly
   standard. Anchoring here rather than at the org root means the tiers land
   correctly for a tenant whose owner does run a weekly scorecard. */
function _pndTopScoredDepth(){
  var best = null;
  try{
    people().forEach(function(p){
      if(!p || p.status !== 'active') return;
      if(!ROLE_STANDARDS[p.roleLabel]) return;
      var d = _pndOrgDepth(p.id);
      if(best === null || d < best) best = d;

}
function _pndLoadLockTiers(){
  try{ return JSON.parse(localStorage.getItem('smb_pnd_lock_tier_v1')||'{}') || {}; }catch(e){ return {}; }
}
function _pndSaveLockTiers(o){
  try{ localStorage.setItem('smb_pnd_lock_tier_v1', JSON.stringify(o||{})); }catch(e){}
}
/* Admin override. Pass null to clear and revert to the org-derived tier. */
function pndSetLockTier(personId, tier){
  var o = _pndLoadLockTiers();

  else o[personId] = Math.max(0, Math.min(2, Number(tier)));

}
function pndLockTier(personId){
  if(!personId) return 2;

  if(ov[personId] != null) return Math.max(0, Math.min(2, Number(ov[personId])));
  return Math.max(0, Math.min(2, _pndOrgDepth(personId) - _pndTopScoredDepth()));

function pndLockTierIsOverridden(personId){

/* Admins keep the ability to correct a locked week. */

function _pndLockDeadlineLabel(personId, weekIso){

/* ============================================================

   Empty weeks count as 0% (D-94) so a role cannot inflate its score by
   skipping weeks. That rule must not reach backwards into weeks before a
   person was ever using the system: on a fresh rollout it drags everyone
   to 0% until a full window of history accumulates.
   A person's tracking therefore starts at their first real entry, computed
   automatically so no setup is required. An admin can override the date per

   ============================================================ */

  try{ return JSON.parse(localStorage.getItem('smb_pnd_tracking_start_v1')||'{}') || {}; }

  try{ localStorage.setItem('smb_pnd_tracking_start_v1', JSON.stringify(o||{})); }catch(e){}

function _pndFirstDataWeek(personId){

  var all = (typeof _pndLoadHuddles==='function') ? _pndLoadHuddles() : {};

  Object.keys(all).forEach(function(k){

function trackingStartFor(personId){
  var cfg = _pndLoadTrackingStart();

  if(cfg.tenantDefault) return cfg.tenantDefault;

}
function setTrackingStartFor(personId, iso){
  var cfg = _pndLoadTrackingStart();

  if(!weekIso) return false;
  var cfg = _pndLoadTrackingStart();
  var explicit = (cfg.byPerson && cfg.byPerson[personId]) || cfg.tenantDefault || null;
  if(explicit) return weekIso >= explicit;
  var first = _pndFirstDataWeek(personId);

function pndSetTrackingStart(personId, iso){
  setTrackingStartFor(personId, iso||null);

/* Meta-strip control. Empty value reverts to the org-derived tier. */
function pndSetLockTierUI(personId, val){

/* ============================================================

     id 32  All PM Performance Points Compliance        -> WL (Will)
     id 38  All ID Performance Points Compliance        -> MN (Mika)
     id 52  All Financial Performance Points Compliance -> LS (Lisa)

   TIMING (deliberate): the number is recomputed inside emitPndSignals(),

  pm:          { label:'All PM',        feedKey:'pnd.compliance.pm',          vspMetricId:32, ownerInitials:'WL',
                 members:['p7','p8'] },
  id:          { label:'All ID',        feedKey:'pnd.compliance.id',          vspMetricId:38, ownerInitials:'MN',

/* A week with nothing entered that has not reached its lock deadline is still

   A partly filled week still scores, so progress is visible as it is entered. */
function _pndWeekPending(personId, weekIso, rec){
  try{
    if(isWeekLocked(personId, weekIso)) return false;        /* closed: blank means 0 */
    if(!rec) return true;
    if(rec.away) return false;                                /* Away is a decision, not a gap */
    var a = rec.answers || {};

  }catch(e){ return false; }

  var person = personById(personId);

  if(std && std.rotates){
    try{ std = ROLE_STANDARDS[person.roleLabel].weeks[activePhaseFor(person, weekIso)-1].items; }catch(e){ std = null; }
  }

  g.members.forEach(function(pid){
    var pct = _pndPersonWeekPct(pid, weekIso);
    if(pct===null) return;

   company lead a day after that, so a group is final on its slowest member. */

  var out = [];

   forWeek() answers per week and returns a number ONLY once that week is
   final. This is deliberate: an open week's percentage still moves as people
   enter their answers, and a half-entered number landing in the Leadership
   Team scorecard is worse than no number. VSP fills a week column from this
   and then that column never changes again.

   The flat window.SMB_SCORECARD_FEED keys are retired. VSP's scApplyFeed()
   writes whatever it is given into the CURRENT week column, but a week is not
   final until partway through the FOLLOWING week, so that path would file
   every reading one column late. Pull by week instead. */
window.SMB_PND_COMPLIANCE = {
  /* Final value for a closed week, or null while the week is still open. */
  forWeek: function(groupId, weekIso){
    try{ return complianceWeekFinal(groupId, weekIso) ? complianceForWeek(groupId, weekIso) : null; }
    catch(e){ return null; }
  },
  /* Per-person contributions behind a closed week's number, or [] while open. */
  breakdownForWeek: function(groupId, weekIso){
    try{ return complianceWeekFinal(groupId, weekIso) ? complianceBreakdownForWeek(groupId, weekIso) : []; }
    catch(e){ return []; }
  },
  /* Has this week closed for everyone in the group. */
  isFinal: function(groupId, weekIso){
    try{ return complianceWeekFinal(groupId, weekIso); }catch(e){ return false; }
  },
  /* Running value for a week whether or not it has closed. For P&D's own
     display and for a supervisor watching the week fill in. Not for VSP. */
  liveForWeek: function(groupId, weekIso){
    try{ return complianceForWeek(groupId, weekIso); }catch(e){ return null; }
  },
  /* Most recent CLOSED week, walking back up to 12 weeks. Returns
     {week, value} or null. */
  latestFinal: function(groupId){
    try{
      var d = mondayOf(new Date());
      for(var k=0;k<12;k++){
        var iso = isoDate(d);
        if(complianceWeekFinal(groupId, iso)) return { week: iso, value: complianceForWeek(groupId, iso) };
        d = _pndPrevWeek(d);
      }
      return null;
    }catch(e){ return null; }
  },
  groups: function(){
    try{
      var g = pndComplianceGroups(), out = {};
      Object.keys(g).forEach(function(k){
        out[k] = { label:g[k].label, feedKey:g[k].feedKey, vspMetricId:g[k].vspMetricId, members:g[k].members.slice() };
      });
      return out;
    }catch(e){ return {}; }
  }
};
/* ============================================================
   COMPLIANCE BRIDGE v1  (P&D -> VSP, staging transport)
   VSP and P&D are two separate pages, so a JS global set here is invisible
   there. Both are served from the same origin, so localStorage is the
   transport until the master shell mounts both modules in one document.

   P&D is the sole writer. Only CLOSED weeks are written: an open week's
   percentage still moves as people enter answers, and a half-entered number
   landing in the Leadership Team scorecard is worse than no number. Once a
   week is written it does not change again unless an admin edits the locked
   week, in which case the corrected value is republished on the next write.

   Shape at smb_pnd_compliance_bridge_v1:
     { v:1, tenantId:'lida-001', updatedAt:<iso>,
       groups: { <groupId>: { vspMetricId:<n>, label:<str>,
                              weeks: { '<weekIso>': <number> } } } }

   Derived data: every device recomputes it from the synced huddle records,
   so it is consistent without being authoritative anywhere.
   ============================================================ */
/* Step back one week without falling foul of the clock change. Subtracting
   7*24 hours in milliseconds lands an hour early across a daylight-saving
   boundary, which rolls the date into the previous day and turns every Monday
   before the change into a Sunday. setDate is calendar-aware and does not. */
function _pndPrevWeek(d){
  var n = new Date(d.getTime());
  n.setDate(n.getDate() - 7);
  n.setHours(0,0,0,0);
  return n;
}
var PND_BRIDGE_KEY = 'smb_pnd_compliance_bridge_v1';
/* A week's value is either a bare number (v1.0) or {total, breakdown} (v1.1).
   Every reader goes through these two so both shapes stay readable. */
function _pndBridgeTotal(val){
  if(val === null || val === undefined) return null;
  if(typeof val === 'number') return val;
  return (typeof val.total === 'number') ? val.total : null;
}
function _pndBridgeBreakdown(val){
  return (val && Array.isArray(val.breakdown)) ? val.breakdown : [];
}
var PND_BRIDGE_WEEKS_BACK = 78;   /* 18 months, so a full backfill year is covered */
/* Hard floor. Nothing before this week is ever published, whatever the data
   says, so a stray record cannot reach back into the scorecard.
   Set to the week of Jan 5 2026 on 2026-07-23, when LIDA finished backfilling
   the year in P&D and Dave confirmed P&D is the record of truth. It previously
   sat at Jul 13 2026, protecting VSP columns that had been filled in by hand.
   Moving it forward is always safe. Moving it back is a decision to let P&D
   compute over numbers a person typed, so it is made deliberately, not drifted
   into. */
var PND_BRIDGE_FIRST_WEEK = '2026-01-05';
function _pndWriteComplianceBridge(){
  try{
    var groups = pndComplianceGroups();
    var out = { v:1, tenantId:'lida-001', updatedAt:new Date().toISOString(), groups:{} };
    var monday = mondayOf(new Date());
    Object.keys(groups).forEach(function(gid){
      var g = groups[gid], weeks = {};
      var d = new Date(monday.getTime());
      for(var k=0; k<PND_BRIDGE_WEEKS_BACK; k++){
        var iso = isoDate(d);
        if(iso < PND_BRIDGE_FIRST_WEEK) break;              /* never write over VSP history */
        if(complianceWeekFinal(gid, iso)){
          var v = complianceForWeek(gid, iso);
          /* v1.1 shape: {total, breakdown[]}. Still under bridge v:1 because a
             consumer reading the old bare number keeps working via _pndBridgeTotal.
             breakdown carries the per-person numbers behind the average so VSP
             can show them on hover. */
          if(v !== null) weeks[iso] = { total: v, breakdown: complianceBreakdownForWeek(gid, iso) };
        }
        d = _pndPrevWeek(d);
      }
      out.groups[gid] = { vspMetricId:g.vspMetricId, label:g.label, weeks:weeks };
    });
    localStorage.setItem(PND_BRIDGE_KEY, JSON.stringify(out));
  }catch(e){}
}
/* Retired: the flat feed keys wrote a closed week's value into VSP's current
   week column. Any stale keys left in a loaded page are cleared so nothing
   downstream can pick up the wrong-column version. */
function _pndPublishComplianceFeed(){
  try{
    if(!window.SMB_SCORECARD_FEED) return;
    var g = pndComplianceGroups();
    Object.keys(g).forEach(function(gid){ delete window.SMB_SCORECARD_FEED[g[gid].feedKey]; });
  }catch(e){}
}

/* Per (report, week) huddle record */
function recKey(){ return state.reportId+'__'+state.weekIso; }
function blankRec(){ return {answers:{}, away:false, conv:{doing:'',support:''}, goals:[], discuss:[], discussed:false, discussedAt:null, savedAt:null}; }
function getRec(){
  var all = pdLoad('huddles', {});
  return all[recKey()] || blankRec();
}
/* True when a record holds nothing a person put there. Several handlers save
   on touch (cadence, phase, discussed, conversation notes), so simply moving
   through weeks could leave blank records behind. Those are invisible in the
   UI but they are still records, and anything that reasons about "the first
   week this person was tracked" would count them. Nothing empty gets stored. */
function _pndRecIsEmpty(rec){
  if(!rec) return true;
  if(rec.away) return false;
  if(rec.discussed) return false;
  if(rec.phaseOverride) return false;
  var a = rec.answers || {};
  for(var k in a){ if(a[k]==='yes' || a[k]==='no') return false; }
  var c = rec.conv || {};
  if((c.doing && String(c.doing).trim()) || (c.support && String(c.support).trim())) return false;
  var g = rec.goals || [];
  for(var i=0;i<g.length;i++){
    var x = g[i] || {};
    if((x.job||x.lastDone||x.lastNote||x.thisDone||x.thisNote||'').toString().trim()) return false;
  }
  var d = rec.discuss || [];
  for(var j=0;j<d.length;j++){
    var y = d[j];
    if(y && (typeof y === 'string' ? y.trim() : (y.text||y.note||'').toString().trim())) return false;
  }
  return true;
}
function putRec(rec){
  _pndInvalidateTrackingCache();
  /* Weekly Scorecard Lock v1: refuse writes to a locked week unless admin. */
  if(!canEditWeek(state.reportId, state.weekIso)){ _pndLockRefuse(state.reportId, state.weekIso); return false; }
  _pndStampLockEdit(rec, state.reportId, state.weekIso);
  var all = pdLoad('huddles', {});
  /* Do not create a record for a week nobody has actually put anything in.
     If one already exists and has just been emptied, drop it rather than
     leaving a blank shell behind. */
  if(_pndRecIsEmpty(rec)){
    if(all[recKey()]){ delete all[recKey()]; pdSave('huddles', all); emitPndSignals(); }
    return true;
  }
  rec.savedAt = new Date().toISOString();
  all[recKey()] = rec;
  pdSave('huddles', all);
  logHistory(state.reportId, state.weekIso, rec);
  emitPndSignals();
  try{ window.dispatchEvent(new CustomEvent('bos.performance.changed',{detail:{personId:state.reportId, kind:'weeklyHuddle'}})); }catch(e){}
}

/* ---- Score computation ---- */
function scoreRec(person, rec){
  var std = standardFor(person);
  if(!std) return null;
  var yes=0, no=0, total=std.length, failedHard=[];
  std.forEach(function(row){
    var v = rec.answers[row.id];
    if(v==='yes') yes++; else { no++; if(row.hard) failedHard.push(row); }
  });
  var pct = total ? Math.round((yes/total)*100) : 0;
  var hardFail = failedHard.length>0;
  var rag = hardFail ? 'red' : (pct>=RAG_GREEN ? 'grn' : (pct>=RAG_AMBER ? 'amb' : 'red'));
  return {yes:yes, no:no, total:total, pct:pct, hardFail:hardFail, failedHard:failedHard, rag:rag, pass:!hardFail && pct>=RAG_AMBER};
}

/* ---- History log ---- */
function logHistory(reportId, weekIso, rec){
  var person = personById(reportId);
  var sc = scoreRec(person, rec);
  var log = pdLoad('history', {});
  var arr = log[reportId] || [];
  arr = arr.filter(function(h){return h.weekIso!==weekIso;});
  arr.push({weekIso:weekIso, pct: sc?sc.pct:null, away:rec.away, pass: sc?sc.pass:null, savedAt:rec.savedAt});
  arr.sort(function(a,b){return b.weekIso.localeCompare(a.weekIso);});
  log[reportId] = arr;
  pdSave('history', log);
}
