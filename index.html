function _renderGoalGauge(m){
  var unit = m.unit || '';
  var goalNum = Number(m.goal);
  // YN metrics → Yes-rate gauge
  if(unit === 'YN') return _renderYNGauge(m);
  if(m.goalType==='inside'||m.goalType==='outside') return _renderBandedGauge(m);
  // Goal not numeric, or stub goal=0 with ≥ (placeholder marketing metrics)
  if(!isFinite(goalNum) || (goalNum === 0 && m.goalType === '\u2265')){
    return _renderNoDataBar('No goal set yet');
  }
  // Goal=0 with = or ≤: keep-at-zero gauge
  if(goalNum === 0) return _renderKeepAtZeroGauge(m);
  // Standard: numeric non-zero goal
  return _renderProjectionGauge(m);
}

function _renderYNGauge(m){
  var yes = 0, no = 0;
  (m.readings||[]).forEach(function(r){
    if(r===null || r===undefined || r==='') return;
    var s = String(r).trim().toLowerCase();
    if(s==='yes' || s==='y' || s==='true' || s==='1') yes++;
    else no++;
  });
  var total = yes + no;
  if(total === 0) return _renderNoDataBar('No Yes/No readings yet');
  var pct = (yes/total)*100;
  // Tier: 95%+ green, 85%+ amber, else red. Tight thresholds since YN is binary.
  var tier = pct >= 95 ? 'green' : pct >= 85 ? 'amber' : 'red';
  var tierVar = tier==='green' ? 'var(--grn)' : tier==='amber' ? 'var(--amb)' : 'var(--red)';
  var bgTint = tier==='green' ? '#dcfce7' : tier==='amber' ? '#fef3c7' : '#fee2e2';
  var tooltip = yes+' of '+total+' weeks Yes (goal: 100% Yes)';
  var h = '<div title="'+tooltip+'" style="position:relative;height:8px;background:'+bgTint+';border-radius:4px;margin-top:6px;overflow:visible">';
  h += '<div style="position:absolute;left:0;top:0;bottom:0;width:'+pct.toFixed(1)+'%;background:'+tierVar+';border-radius:4px 0 0 4px"></div>';
  h += '<div title="Goal" style="position:absolute;left:100%;top:-2px;bottom:-2px;width:2px;background:var(--sb);transform:translateX(-2px)"></div>';
  h += '</div>';
  return h;
}

function _renderBandedGauge(m){
  var lo=Number(m.goalMin), hi=Number(m.goalMax);
  var vals=(m.readings||[]).filter(function(r){return typeof r==='number'&&isFinite(r);});
  if(!isFinite(lo)||!isFinite(hi)||!vals.length) return _renderNoDataBar('No readings yet');
  var sum=vals.reduce(function(a,b){return a+b;},0);
  var rv=(m.rollupAs==='Total')?sum:(sum/vals.length);
  var inside=(m.goalType==='inside');
  var tier=_scTier(m,rv);
  var tierVar=tier==='green'?'var(--grn)':tier==='amber'?'var(--amb)':'var(--red)';
  var span=Math.abs(hi-lo)||Math.abs(hi)||1; var pad=span*0.45;
  var loB=Math.min(lo,rv)-pad, hiB=Math.max(hi,rv)+pad; var range=(hiB-loB)||1;
  function pc(x){return Math.max(0,Math.min(100,(x-loB)/range*100));}
  var zL=pc(lo), zR=pc(hi), mk=pc(rv);
  var tip='Target '+(inside?'between':'outside')+' '+fmtVal(lo,m.unit)+' and '+fmtVal(hi,m.unit);
  var h='<div title="'+tip+'" style="position:relative;height:8px;background:var(--sur2);border-radius:4px;margin-top:6px;overflow:visible">';
  h+='<div style="position:absolute;top:0;bottom:0;left:'+zL.toFixed(1)+'%;width:'+(zR-zL).toFixed(1)+'%;background:'+(inside?'#dcfce7':'#fee2e2')+';border-radius:3px"></div>';
  h+='<div style="position:absolute;top:-3px;bottom:-3px;left:'+mk.toFixed(1)+'%;width:3px;background:'+tierVar+';transform:translateX(-1.5px);border-radius:2px"></div>';
  h+='</div>';
  h+='<div style="display:flex;justify-content:space-between;font-size:var(--fz-xs);color:var(--txm);margin-top:3px;line-height:1.2"><span>'+fmtVal(lo,m.unit)+'</span><span style="font-weight:700;color:'+tierVar+'">'+fmtVal(rv,m.unit)+(m.rollupAs==='Total'?' total':' avg')+'</span><span>'+fmtVal(hi,m.unit)+'</span></div>';
  return h;
}

function _renderProjectionGauge(m){
  var goal = Number(m.goal);
  var vals = [];
  (m.readings||[]).forEach(function(r){
    if(r!==null && r!==undefined && typeof r==='number' && isFinite(r)) vals.push(r);
  });
  if(!vals.length) return _renderNoDataBar('No readings yet');
  var avg = vals.reduce(function(a,b){return a+b;},0) / vals.length;
  if(!isFinite(avg)) return _renderNoDataBar('No readings yet');
  var rv = (m.rollupAs==='Total') ? vals.reduce(function(a,b){return a+b;},0) : avg;
  var tier = _scTier(m, rv);
  var tierVar = tier==='green' ? 'var(--grn)' : tier==='amber' ? 'var(--amb)' : 'var(--red)';
  var bgTint = tier==='green' ? '#dcfce7' : tier==='amber' ? '#fef3c7' : '#fee2e2';
  // Progress-to-goal fill driven by the period average and the edit-tab orientation.
  var fillPct;
  if(m.goalType === '\u2265'){
    fillPct = goal !== 0 ? Math.max(0, Math.min(100, (rv/goal)*100)) : 0;
  } else if(m.goalType === '\u2264'){
    fillPct = goal !== 0 ? Math.max(0, Math.min(100, ((goal-rv)/goal)*100)) : 0;
  } else {
    var dev = goal !== 0 ? Math.abs(rv - goal) / Math.abs(goal) : 0;
    fillPct = Math.max(0, Math.min(100, (1-dev)*100));
  }
  var tooltip = 'Bar fill = period average against goal. Color follows the red/amber/green rule from the edit tab.';
  var h = '<div title="'+tooltip+'" style="position:relative;height:8px;background:'+bgTint+';border-radius:4px;margin-top:6px;overflow:visible">';
  h += '<div style="position:absolute;left:0;top:0;bottom:0;width:'+fillPct.toFixed(1)+'%;background:'+tierVar+';border-radius:4px 0 0 4px"></div>';
  h += '<div title="Goal" style="position:absolute;left:100%;top:-2px;bottom:-2px;width:2px;background:var(--sb);transform:translateX(-2px)"></div>';
  h += '</div>';
  h += '<div style="display:flex;justify-content:space-between;font-size:var(--fz-xs);color:var(--txm);margin-top:3px;line-height:1.2">';
  h += '<span>'+fmtVal(rv, m.unit)+(m.rollupAs==='Total'?' total':' avg')+'</span>';
  h += '<span>'+m.goalType+' '+fmtVal(goal, m.unit)+' goal</span>';
  h += '</div>';
  return h;
}

function _renderKeepAtZeroGauge(m){
  var pts = [];
  (m.readings||[]).forEach(function(r,i){
    if(typeof r==='number' && isFinite(r)) pts.push({x:i, y:r});
  });
  if(!pts.length) return _renderNoDataBar('No readings yet');
  var weeksOut = _weeksToQuarterEnd();
  var rawProjected = null, mode = '';
  if(pts.length >= 3){
    var n=pts.length, sx=0, sy=0, sxx=0, sxy=0;
    pts.forEach(function(p){ sx+=p.x; sy+=p.y; sxx+=p.x*p.x; sxy+=p.x*p.y; });
    var denom = n*sxx - sx*sx;
    if(denom !== 0){
      var slope = (n*sxy - sx*sy) / denom;
      var intercept = (sy - slope*sx) / n;
      var lastX = pts[pts.length-1].x;
      var v = slope*(lastX + weeksOut) + intercept;
      if(isFinite(v)){ rawProjected = v; mode = 'projected'; }
    }
  }
  if(rawProjected === null){
    rawProjected = pts.reduce(function(a,p){return a+p.y;},0) / pts.length;
    mode = 'avg';
  }
  // Progress-to-goal model: 100% fill = at zero (perfect), 0% fill = at worst observed
  // Scale by max observed magnitude so the bar moves visibly as readings change.
  var maxObs = pts.reduce(function(a,p){return Math.max(a, Math.abs(p.y));}, 0);
  if(maxObs === 0) maxObs = 1;
  var fillPct;
  if(rawProjected <= 0){
    fillPct = 100;  // at or below zero = perfect
  } else {
    fillPct = Math.max(0, Math.min(100, ((maxObs - rawProjected) / maxObs) * 100));
  }
  // Tier: at zero = green, small deviation = amber, large = red
  var tier;
  if(rawProjected <= 0) tier = 'green';
  else if(rawProjected / maxObs <= 0.1) tier = 'amber';
  else tier = 'red';
  var tierVar = tier==='green' ? 'var(--grn)' : tier==='amber' ? 'var(--amb)' : 'var(--red)';
  var bgTint = tier==='green' ? '#dcfce7' : tier==='amber' ? '#fef3c7' : '#fee2e2';
  var leftLbl = mode==='projected'
    ? fmtVal(rawProjected, m.unit) + ' projected'
    : fmtVal(rawProjected, m.unit) + ' avg';
  var tooltip = 'Keep-at-zero metric: 0 = on goal. Full bar = at goal, empty bar = worst observed.';
  var h = '<div title="'+tooltip+'" style="position:relative;height:8px;background:'+bgTint+';border-radius:4px;margin-top:6px;overflow:visible">';
  h += '<div style="position:absolute;left:0;top:0;bottom:0;width:'+fillPct.toFixed(1)+'%;background:'+tierVar+';border-radius:4px 0 0 4px"></div>';
  h += '<div title="Goal" style="position:absolute;left:100%;top:-2px;bottom:-2px;width:2px;background:var(--sb);transform:translateX(-2px)"></div>';
  h += '</div>';
  h += '<div style="display:flex;justify-content:space-between;font-size:var(--fz-xs);color:var(--txm);margin-top:3px;line-height:1.2">';
  h += '<span>'+leftLbl+'</span>';
  h += '<span>'+m.goalType+' '+fmtVal(0, m.unit)+' goal</span>';
  h += '</div>';
  return h;
}

function _metricBounds(m){
  var t = (m.title||'').toLowerCase();
  var unit = m.unit || '';
  if(unit === '%'){
    if(/margin|profit|npbt|return\s*on/.test(t)) return {min:-50, max:200};
    return {min:0, max:100};
  }
  if(/\b1-10\b|1 to 10|rating 1-10/.test(t)) return {min:1, max:10};
  if(unit === 'YN') return {min:0, max:1};
  if(/\bprofit\b|\bnpbt\b|\bcash\b|write-?off|warranty|fade|variance/.test(t)){
    return {min:-Infinity, max:Infinity};
  }
  return {min:0, max:Infinity};
}

function _weeksToQuarterEnd(){
  var t = new Date();
  var y = t.getFullYear();
  var m = t.getMonth();                        // 0-based
  var qEndMonth = Math.floor(m/3)*3 + 2;       // 2,5,8,11
  var qEnd = new Date(y, qEndMonth+1, 0);      // last day of qEndMonth
  var diff = qEnd.getTime() - t.getTime();
  return Math.max(1, Math.ceil(diff/(7*24*60*60*1000)));
}

function _scDateRanges(){
  var N=weekRanges.length;
  // Anchor ranges to the CURRENT week, not just the last week with data, so the
  // current (and any recent empty) weeks are always visible for entry.
  var cur=Math.max(scLastDataIdx(), scCurrentWeekIdx());
  var ps=scPlanStartIdx();
  function desc(lo,hi){ var r=[]; if(lo<0)lo=0; if(hi>N-1)hi=N-1; for(var i=hi;i>=lo;i--) r.push(i); return r; }
  function lastN(n){ return desc(cur-n+1, cur); }
  var cd=scWeekDate(cur); var cyr=cd.getFullYear(); var cq=Math.floor(cd.getMonth()/3);
  var qStart=cur; for(var i=cur;i>=0;i--){ var d=scWeekDate(i); if(d.getFullYear()===cyr && Math.floor(d.getMonth()/3)===cq){ qStart=i; } else { break; } }
  var _ys=-1,_ye=-1; for(var _i=0;_i<N;_i++){ if(scWeekDate(_i).getFullYear()===cyr){ if(_ys<0)_ys=_i; _ye=_i; } } if(_ys<0){ _ys=0; _ye=N-1; }
  function _ci(){

function _recalcMetric(m){

function _scConvReadings(readings, oldCad, newCad, m){

function saveEditMeasurable(){
  var p=state.editMeasurablePanel;
  var section=scorecard.find(function(s){return s.metrics.some(function(m){return m.id===p.metricId;});});
  if(!section) return;
  var metric=section.metrics.find(function(m){return m.id===p.metricId;});
  if(!metric) return;

  var title=document.getElementById('em-title');
  var desc=document.getElementById('em-desc');
  var unit=document.getElementById('em-unit');
  var orient=document.getElementById('em-orient');
  var val=document.getElementById('em-value');
  var rollup=document.getElementById('em-rollup');

  if(!title||!title.value.trim()){alert('Title is required.');return;}

  var orientMap={
    'Greater than or equal to goal':'\u2265','Greater than goal':'>','Equal to goal':'=',
    'Less than goal':'<','Less than or equal to goal':'\u2264',
    'Inside min and max':'inside','Outside min and max':'outside'
  };
  var unitMap={Currency:'$',Percentage:'%',Number:'#',"Yes/No":'YN',Time:'h'};
  var unitType=unit?unit.value:'Number';
  var orientRule=orient?orient.value:'Greater than or equal to goal';

  // If section (role) changed, move metric to the chosen section (by index)
  var _emOwnerEl=document.getElementById('em-person'); var _emSeatEl=document.getElementById('em-seat');
  var newIdx=_resolveSectionByOwnerSeat(_emOwnerEl?_emOwnerEl.value:'', _emSeatEl?_emSeatEl.value:'', scorecard.indexOf(section));
  if(scorecard[newIdx] && scorecard[newIdx]!==section){
    var midx=section.metrics.findIndex(function(m){return m.id===p.metricId;});
    if(midx>-1) section.metrics.splice(midx,1);
    scorecard[newIdx].metrics.push(metric);
    metric.owner=scorecard[newIdx].ownerId;
  }

  metric.title=title.value.trim();
  metric.description=desc?desc.value:'';
  metric.goal=(unitType==='Yes/No')?'Yes':(parseFloat(val?val.value:0)||0);
  var _emW=document.getElementById('em-watch'); metric.watch=(_emW&&_emW.value.trim()!=='')?parseFloat(_emW.value):undefined;
  metric.goalType=(unitType==='Yes/No')?'=':(orientMap[orientRule]||'\u2265');
  var _gmin=document.getElementById('em-goalmin'), _gmax=document.getElementById('em-goalmax');
  metric.goalMin=(_gmin&&_gmin.value.trim()!=='')?parseFloat(_gmin.value):undefined;
  metric.goalMax=(_gmax&&_gmax.value.trim()!=='')?parseFloat(_gmax.value):undefined;
  metric.unit=unitMap[unitType]||'#';
  metric.unitType=unitType;
  metric.orientationRule=orientRule;
  var _emAuto=document.getElementById('em-auto');
  if(_emAuto){
    if(_emAuto.checked){
      if(!metric.auto && metric._autoKey){ metric.auto=metric._autoKey; metric.autoSrc=metric._autoSrc; delete metric._autoKey; delete metric._autoSrc; }
    } else {
      if(metric.auto){ metric._autoKey=metric.auto; metric._autoSrc=metric.autoSrc; }
      delete metric.auto; delete metric.autoSrc;
    }
  }
  var _emInd=document.getElementById('em-indicator'); if(_emInd) metric.indicator=_emInd.value;
  metric.rollupAs=rollup?rollup.value:'Total';
  var _emST=document.getElementById('em-showTotal'); if(_emST) metric.showTotal=_emST.checked;
  var _emSA=document.getElementById('em-showAvg'); if(_emSA) metric.showAverage=_emSA.checked;
  var _emSG=document.getElementById('em-showGoal'); if(_emSG) metric.showGoal=_emSG.checked;
  var _ecop=(document.getElementById('em-calcop')||{}).value||'none';
  if(_ecop!=='none'){
    var _esrc=[].slice.call(document.querySelectorAll('.em-calcsrc:checked')).map(function(c){return c.value;});
    if(_esrc.length < ((_ecop==='ratio'||_ecop==='divide')?2:1)){ alert((_ecop==='ratio'||_ecop==='divide')?'Pick at least two measurables - first is A, second is B.':'Pick at least one source measurable.'); return; }
    metric.calc={op:_ecop, sources:_esrc}; metric.auto=undefined; metric.autoSrc=undefined;
  } else { metric.calc=undefined; }
  var _newCad=(document.getElementById('em-cadence')||{}).value||'weekly';

function scMDragStart(ev,mid){ state.scDragMid=mid; try{ ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain',String(mid)); }catch(e){} }
function scMDragOver(ev){
  if(state.scDragMid==null) return;
  ev.preventDefault(); try{ ev.dataTransfer.dropEffect='move'; }catch(e){}
  var row=ev.currentTarget; if(!row||!row.cells||!row.getBoundingClientRect) return;
  var r=row.getBoundingClientRect(); var below = ev.clientY > (r.top + r.height/2);
  if(window._scDropRow && window._scDropRow!==row) _scClearDropInd();
  var sh = below ? 'inset 0 -4px 0 0 var(--blu), 0 4px 4px -2px rgba(37,99,235,.35)' : 'inset 0 4px 0 0 var(--blu), 0 -4px 4px -2px rgba(37,99,235,.35)';
  for(var i=0;i<row.cells.length;i++) row.cells[i].style.boxShadow=sh;
  window._scDropRow=row; window._scDropBelow=below;
}


function scMDrop(ev,targetMid){
  if(state.scDragMid==null){ _scClearDropInd(); return; }
  ev.preventDefault(); ev.stopPropagation();
  var below=window._scDropBelow; _scClearDropInd();
  var src=state.scDragMid; state.scDragMid=null;
  if(src===targetMid){ renderPage(); return; }
  var srcSec=scorecard.find(function(s){return s.metrics.some(function(m){return m.id===src;});});
  var tgtSec=scorecard.find(function(s){return s.metrics.some(function(m){return m.id===targetMid;});});
  if(!srcSec||!tgtSec){ renderPage(); return; }
  var si=srcSec.metrics.findIndex(function(m){return m.id===src;}); var metric=srcSec.metrics[si];
  srcSec.metrics.splice(si,1);
  var ti=tgtSec.metrics.findIndex(function(m){return m.id===targetMid;}); if(ti<0) ti=tgtSec.metrics.length;
  var pos = below ? ti+1 : ti;
  tgtSec.metrics.splice(pos,0,metric);
  if(srcSec!==tgtSec) metric.owner=tgtSec.ownerId;
  state.scorecardSort='manual';
  var tm=teamsRegistry[state.currentTeam]; if(tm) tm.scorecard=scorecard;
  try{ if(typeof vspSaveNow==='function') vspSaveNow(); }catch(e){}
  renderPage();
}

function bulkMoveSelected(targetIdx){
  var keys=Object.keys(state.selectedMetrics);
  if(!keys.length) return;
  var targetSection=scorecard[parseInt(targetIdx,10)];
  if(!targetSection) return;
  keys.forEach(function(key){
    var sel=state.selectedMetrics[key];
    if(targetSection.metrics.some(function(m){return m.id===sel.metricId;})) return; // already in target
    var section=scorecard.find(function(s){return s.metrics.some(function(m){return m.id===sel.metricId;});});
    if(section){
      var idx=section.metrics.findIndex(function(m){return m.id===sel.metricId;});
      if(idx>-1){
        var metric=section.metrics.splice(idx,1)[0];
        targetSection.metrics.push(metric);
      }
    }
  });
  state.selectedMetrics={};
  renderPage();
}

function bulkDeleteSelected(){
  var keys=Object.keys(state.selectedMetrics);
  if(!keys.length) return;
  if(!confirm('Delete '+keys.length+' measurable'+(keys.length>1?'s':'')+' ? This cannot be undone.')) return;
  keys.forEach(function(key){
    var sel=state.selectedMetrics[key];
    var section=scorecard.find(function(s){return s.metrics.some(function(m){return m.id===sel.metricId;});});
    if(section){

/* ==========================================================================
   VSP SCORECARD ADAPTER for P&D
   Hosts VSP's scorecard subsystem verbatim. The ONLY layout edit is the
   Role Deliverables column inserted before Title inside renderScorecard.
   Every panel, handler, and helper is VSP's real code, not a stub.
   ========================================================================== */

/* Persistence: VSP writes to its own tenant blob via vspSaveNow(). P&D
   redirects those writes into per-week huddle records. */
function _pndLoadHuddles(){ try{ var v=localStorage.getItem('smb_perf_huddles_v1'); return v?JSON.parse(v):{}; }catch(e){ return {}; } }
function _pndSaveHuddles(m){ try{ localStorage.setItem('smb_perf_huddles_v1', JSON.stringify(m)); }catch(e){} }

/* Role-standard persistence: admin edits to the Weekly Performance Standard
   template are saved per role label so drag-reorder, add, edit, and delete
   from VSP's authoring surfaces stick across renders and switches.
   Storage key: smb_perf_role_standards_v1 = { roleLabel: [{id,sec,hard,std,due},...] }
   Access rule: whoever passes the module gate (supervisor OR hr) is admin,
   consistent with how the rest of the module treats "make changes". */
function _pndLoadRoleStandards(){ try{ var v=localStorage.getItem('smb_perf_role_standards_v1'); return v?JSON.parse(v):{}; }catch(e){ return {}; } }
function _pndSaveRoleStandards(m){ try{ localStorage.setItem('smb_perf_role_standards_v1', JSON.stringify(m)); }catch(e){} }

/* Reverse-map: given the current scorecard[0].metrics (which VSP mutates on
   save/add/delete), produce a standards template that can be re-fed to
   _pndBuildScorecardData. New metrics from VSP lack _rowId; we mint one. */
function _pndStripHardTag(t){
  return String(t||'')
    .replace(/<div[^>]*>\s*<span[^>]*>\s*Hard Fail if not Yes\s*<\/span>\s*<\/div>\s*/gi, '')
    .replace(/\s*<span[^>]*>Hard fail<\/span>/gi, '')
    .trim();
}
function _pndExtractStandardsFromScorecard(){
  if(!scorecard || !scorecard[0]) return [];
  return scorecard[0].metrics.map(function(m, i){
    var rid = m._rowId;
    if(!rid){ rid = 'r'+Date.now()+'_'+i; m._rowId = rid; }
    return {
      id: rid,
      sec: m.deliverable || 'General',
      hard: !!m._hard,
      std: _pndStripHardTag(m.title),
      due: m.description || ''
    };
  });
}
function _pndPersistRoleStandards(){
  if(!_pndCurRole) return;
  var list = _pndExtractStandardsFromScorecard();
  var map = _pndLoadRoleStandards();
  map[_pndCurRole] = list;
  _pndSaveRoleStandards(map);
}

/* Wrap VSP's authoring save handlers ONCE, after the port has loaded them.
   VSP mutates scorecard[0].metrics in-place; after that mutation we also
   pull em-rd (P&D's Role Deliverable field) from the panel and write it
   to the metric.deliverable, then snapshot the template back to storage. */
/* Move Up / Move Down handlers - one-click reorder, reliable alternative
   to HTML5 drag. Called from the buttons rendered next to the grip. */
function pndMoveUp(id){
  if(!scorecard || !scorecard[0]) return;
  var metrics = scorecard[0].metrics;
  var i = metrics.findIndex(function(m){ return m.id===id; });
  if(i<=0) return;
  var tmp = metrics[i-1]; metrics[i-1] = metrics[i]; metrics[i] = tmp;
  state.scorecardSort = 'manual';
  try{ vspSaveNow(); }catch(e){}
  renderPage();
}
function pndMoveDown(id){
  if(!scorecard || !scorecard[0]) return;
  var metrics = scorecard[0].metrics;
  var i = metrics.findIndex(function(m){ return m.id===id; });
  if(i<0 || i>=metrics.length-1) return;
  var tmp = metrics[i+1]; metrics[i+1] = metrics[i]; metrics[i] = tmp;
  state.scorecardSort = 'manual';
  try{ vspSaveNow(); }catch(e){}
  renderPage();
}

/* Per-week Away toggle - marks a week as Holiday/Sick/etc so it does not count.
   Called from the Away chip inside each Weekly Score cell in the totals row. */
/* Empty a week in one action. The three-state cell cycle (empty -> Yes -> No
   -> empty) means clearing by hand costs up to three clicks per row and stops
   on No if you miscount, which is how a week can end up reading all-No when
   the intent was to blank it. This does the whole week at once.
   Confirms first: it is destructive and there is no undo. */
function pndClearWeek(iso){
  if(!iso || !_pndScReportId) return;
  if(!canEditWeek(_pndScReportId, iso)){ _pndLockRefuse(_pndScReportId, iso); return; }
  var all = _pndLoadHuddles();
  var key = _pndScReportId + '__' + iso;
  var rec = all[key];
  var n = (rec && rec.answers) ? Object.keys(rec.answers).length : 0;
  if(!n){ toast('That week is already empty.'); return; }
  var person = personById(_pndScReportId);
  if(!window.confirm('Clear all '+n+' answers for '+(person?person.first:'this person')+', week of '
      +_pndFormatDateShort(iso)+'?\n\nThis cannot be undone.')) return;
  _pndStampLockEdit(rec, _pndScReportId, iso);
  rec.answers = {};
  rec.savedAt = new Date().toISOString();
  all[key] = rec;
  _pndSaveHuddles(all);
  try{ emitPndSignals(); }catch(e){}
  try{ window.dispatchEvent(new CustomEvent('bos.performance.changed',{detail:{personId:_pndScReportId, kind:'weeklyHuddle'}})); }catch(e){}
  toast('Week of '+_pndFormatDateShort(iso)+' cleared.');
  renderPage();
}
function pndToggleAway(iso){
  if(!_pndScReportId || !iso) return;

     missed week cannot be retroactively excused. */

}

var __pnd_wrappedSaves = false;
function _pndWrapVSPSaves(){
  if(__pnd_wrappedSaves) return;
  __pnd_wrappedSaves = true;
  function wrap(name){
    if(typeof window[name] !== 'function') return;
    var orig = window[name];
    window[name] = function(){
      /* Read em-rd BEFORE calling orig, because VSP's save closes the panel
         and clears the DOM. */
      var rdVal = null;
      var rdEl = document.getElementById('em-rd');
      if(rdEl) rdVal = String(rdEl.value||'').trim();
      var editingMetricId = (state.editMeasurablePanel && state.editMeasurablePanel.metricId) || null;
      var ret;
      try{ ret = orig.apply(this, arguments); }catch(e){ ret = undefined; }
      /* After VSP save: write the Role Deliverable back to the metric. */
      if(rdVal!=null && editingMetricId!=null && scorecard && scorecard[0]){
        var m = scorecard[0].metrics.find(function(x){ return x.id===editingMetricId; });
        if(m) m.deliverable = rdVal || 'General';
      }
      try{ _pndPersistRoleStandards(); }catch(e){}
      return ret;
    };
  }
  wrap('saveEditMeasurable');
  wrap('saveNewMeasurable');
  wrap('deleteEditMeasurable');
}

var _pndScMap = null;
var _pndScReportId = null;
var SC_PLAN_LABEL = '';   /* set dynamically to weekRanges[0] in _pndBuildScorecardData */

function persistPndScorecard(){
  if(!scorecard || !scorecard[0]) return;
  var all = _pndLoadHuddles();
  var weeks = _pndScWeekIsos.slice();      /* no sentinel; readings[i] <-> weeks[i] */
  scorecard[0].metrics.forEach(function(m){
    var rowId = m._rowId;                  /* stable identity, moves with the metric on reorder */
    if(!rowId) return;
    (m.readings||[]).forEach(function(v, wi){
      var iso = weeks[wi]; if(!iso) return;
      /* Weekly Scorecard Lock v1: never bulk-persist over a locked week. */
      if(!canEditWeek(_pndScReportId, iso)) return;
      var key = _pndScReportId + '__' + iso;
      var norm = null;
      if(v==null || v==='') norm = null;
      else {
        var s = String(v).trim().toLowerCase();
        norm = (s==='yes'||s==='y'||s==='true'||s==='1') ? 'yes' : 'no';
      }
      var rec = all[key];
      if(norm===null){
        /* Don't materialize an empty record for a week with no answers. */
        if(rec && rec.answers && rec.answers[rowId]!=null){
          delete rec.answers[rowId];
          rec.savedAt = new Date().toISOString();
          all[key] = rec;
        }
        return;
      }
      rec = rec || {answers:{}, away:false, conv:{doing:'',support:''}, goals:[], discuss:[], savedAt:null};
      rec.answers = rec.answers||{};
      rec.answers[rowId] = norm;
      rec.savedAt = new Date().toISOString();
      all[key] = rec;
    });
  });
  _pndSaveHuddles(all);
  try{ emitPndSignals(); }catch(e){}
  try{ window.dispatchEvent(new CustomEvent('bos.performance.changed',{detail:{personId:_pndScReportId, kind:'weeklyHuddle'}})); }catch(e){}
}
function vspSaveNow(){ persistPndScorecard(); _pndPersistOrder(); }
function vspSaveAll(){ persistPndScorecard(); _pndPersistOrder(); }
function rerenderKeepScroll(){ renderPage(); }

var _pndScWeekIsos = [];
function _pndScBuildWeeks(){
  /* 52 real week labels ending at state.weekIso (current). No SC_PLAN_LABEL
     sentinel; instead we bind SC_PLAN_LABEL to the first real week's label
     so VSP's scPlanStartIdx() / scWeekDate() math anchors correctly.
     For rotating standards with state.phaseFilter set, keep the 52-week
     scaffold but only include weeks whose active phase matches the filter
     (padded with the surrounding weeks to keep visual continuity). */
  _pndScWeekIsos = [];
  for(var i=51; i>=0; i--) _pndScWeekIsos.push(addDays(state.weekIso, -i*7));

  /* Phase filter for rotating roles */
  try{
    var person = personById(_pndScReportId || state.reportId);
    if(person && typeof isRotatingRole==='function' && isRotatingRole(person) && state.phaseFilter){
      _pndScWeekIsos = _pndScWeekIsos.filter(function(iso){
        return activePhaseFor(person, iso) === state.phaseFilter;
      });
    }
  }catch(e){}

  return _pndScWeekIsos;
}
function _pndScWeekLabel(iso){
  var end = addDays(iso, 6);
  function fmt(d){ var p=d.split('-'); var dt=new Date(+p[0],+p[1]-1,+p[2]); var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return mo[dt.getMonth()]+' '+String(dt.getDate()).padStart(2,'0'); }
  return fmt(iso)+' - '+fmt(end);
}

function _pndScReadings(rowId){
  var all = _pndLoadHuddles();
  return _pndScWeekIsos.map(function(iso){
    var rec = all[_pndScReportId+'__'+iso];
    if(!rec) return null;
    var v = rec.answers && rec.answers[rowId];
    return v==='yes' ? 'Yes' : (v==='no' ? 'No' : null);
  });
}

function _pndBuildScorecardData(person, std, weeksOverride){
  _pndScReportId = person.id;
  if(Array.isArray(weeksOverride) && weeksOverride.length){
    _pndScWeekIsos = weeksOverride.slice();
  } else {
    _pndScBuildWeeks();
  }
  var cs = colorForSlot(person.colorSlot);

  /* Honor any user reorder saved for this role. */
  var roleKey = person.roleLabel || 'Role';
  var orderMap = (function(){ try{ return JSON.parse(localStorage.getItem('smb_perf_role_order_v1')||'{}'); }catch(e){ return {}; } })();
  var savedOrder = orderMap[roleKey];

  /* Prefer persisted role standards (from admin edits via VSP's authoring
     panels) over the hardcoded seed. First edit creates the persisted copy;
     subsequent edits mutate it. */
  var persistedStd = _pndLoadRoleStandards()[roleKey];
  var effectiveStd = (Array.isArray(persistedStd) && persistedStd.length) ? persistedStd : std;

  var stdOrdered = effectiveStd.slice();
  if(Array.isArray(savedOrder) && savedOrder.length){
    var byId = {}; effectiveStd.forEach(function(r){ byId[r.id]=r; });
    stdOrdered = [];
    savedOrder.forEach(function(rid){ if(byId[rid]){ stdOrdered.push(byId[rid]); delete byId[rid]; } });
    Object.keys(byId).forEach(function(rid){ stdOrdered.push(byId[rid]); });
  }
  _pndOrderedStd = stdOrdered;

  _pndScMap = {};
  var metrics = stdOrdered.map(function(row, i){
    _pndScMap[i] = { rowId: row.id, weeks: _pndScWeekIsos.slice() };
    return {
      id: i+1,
      _rowId: row.id,
      title: (row.hard ? '<div style="margin-bottom:5px"><span style="display:inline-block;background:#dc2626;color:#fff;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">Hard Fail if not Yes</span></div>' : '') + row.std,
      description: row.due,
      unit: 'YN',
      goalType: '=',
      goal: 'Yes',
      rollupAs: 'Average',
      cadence: 'weekly',
      readings: _pndScReadings(row.id),
      notes: {},
      deliverable: row.sec,
      deadline: row.due || '',
      _hard: row.hard
    };
  });

  scorecard = [{
    ownerId: person.initials,
    ownerName: (person.first+' '+person.last),
    seat: person.roleLabel || 'Role',
    color: cs.fg,
    metrics: metrics
  }];

  /* weekRanges = 52 real week labels. Bind SC_PLAN_LABEL to the first one so
     scPlanStartIdx() returns 0, and set SC_PLAN_START_DATE to that week's
     Monday so scWeekDate(i) resolves each i correctly. */
  weekRanges = _pndScWeekIsos.map(_pndScWeekLabel);
  SC_PLAN_LABEL = weekRanges[0];
  var _p0 = _pndScWeekIsos[0].split('-');
  SC_PLAN_START_DATE = new Date(+_p0[0], +_p0[1]-1, +_p0[2]);

  teamsRegistry = {
    'pd': { id:'pd', name:'Performance', color:'#2563eb', scorecard: scorecard,
            goals:[], todos:[], issues:[], headlines:[], meetings:{}, planData:{} }
  };
  state.currentTeam = 'pd';

  ppl = [{
    initials: person.initials,
    first: person.first,
    last: person.last,
    color: cs.fg,
    photo: ''
  }];
  peoplePhotos = {};
  peoplePhotos[person.initials] = { name: person.first+' '+person.last, photo:'' };
}

/* Persistence of drag reorder: called after scMDrop mutates scorecard[0].metrics.
   Reads the current metric order (using _rowId which survives the reorder) and
   writes it under the person's roleLabel. */
var _pndOrderedStd = null;
var _pndCurRole = null;
function _pndPersistOrder(){
  if(!scorecard || !scorecard[0] || !_pndCurRole) return;
  var order = scorecard[0].metrics.map(function(m){ return m._rowId; }).filter(Boolean);
  var map;
  try{ map = JSON.parse(localStorage.getItem('smb_perf_role_order_v1')||'{}'); }catch(e){ map = {}; }
  map[_pndCurRole] = order;
  try{ localStorage.setItem('smb_perf_role_order_v1', JSON.stringify(map)); }catch(e){}
}

/* YN cell click adapter: toggle Yes <-> No. VSP's inline text editor is wrong
   for YN. For any non-YN unit (there won't be any in P&D), we fall through to
   VSP's real editor.
   Multi-scorecard support: when the rotating-standard huddle renders 4 stacked
   scorecards, module state (`scorecard`, `_pndScWeekIsos`) only reflects the
   LAST rendering. To route clicks correctly, each phase's render captures its
   state into _pndPhaseState[N], a capture-phase listener records which phase
   the click came from, and this override reads from that phase's captured
   state instead of the shared module state. */
var _pndPhaseState = {};           /* phase -> { scorecard, weeks, personId } */
var _pndActiveClickPhase = null;   /* set by capture-phase listener just before onclick fires */
var __pnd_origOpenCellEdit = null;
var __pnd_clickCaptureInstalled = false;

function _pndInstallCellClickAdapter(){
  if(!__pnd_clickCaptureInstalled){
    /* Capture-phase listener: fires BEFORE VSP's inline onclick, so the phase
       is set by the time openCellEdit runs. */
    document.addEventListener('click', function(ev){
      var t = ev.target;
      var phaseEl = null;
      while(t && t!==document.body){
        if(t.classList && t.classList.contains('rot-phase')){ phaseEl = t; break; }
        t = t.parentNode;
      }
      _pndActiveClickPhase = phaseEl ? parseInt(phaseEl.getAttribute('data-phase')) : null;
    }, true);
    __pnd_clickCaptureInstalled = true;
  }
  if(__pnd_origOpenCellEdit) return;
  __pnd_origOpenCellEdit = openCellEdit;
  openCellEdit = function(ownerId, metricId, weekIdx){
    /* Resolve which scorecard state to use: captured phase (rotating role) or
       module state (single scorecard). */
    var ps = (_pndActiveClickPhase && _pndPhaseState[_pndActiveClickPhase]) ? _pndPhaseState[_pndActiveClickPhase] : null;
    var sc = ps ? ps.scorecard : (scorecard && scorecard[0]);
    var weeks = ps ? ps.weeks : _pndScWeekIsos;
    var personId = ps ? ps.personId : _pndScReportId;
    if(!sc) return;
    var m = sc.metrics.find(function(x){ return x.id===metricId; });
    if(!m || m.unit!=='YN') return __pnd_origOpenCellEdit(ownerId, metricId, weekIdx);
    var cur = m.readings[weekIdx];
    var s = cur==null?null:String(cur).toLowerCase();
    var isYes = (s==='yes'||s==='y'||s==='true'||s==='1');
    var isNo  = (s==='no'||s==='n'||s==='false'||s==='0');
    /* Weekly Scorecard Lock v1: a locked week is read-only. Refuse before
       mutating readings so the grid does not show a value that never saved. */
    var _lockIso = weeks[weekIdx];
    if(_lockIso && !canEditWeek(personId, _lockIso)){ _pndLockRefuse(personId, _lockIso); return; }
    /* Three-state cycle: empty -> Yes -> No -> empty. Clearing back to empty
       matters because an unanswered row is a distinct state from an explicit
       No: it lets someone undo a mis-click instead of being stuck on Yes/No. */
    var next = isYes ? 'No' : (isNo ? null : 'Yes');
    m.readings[weekIdx] = next;
    /* Write directly to huddles storage keyed by rowId + weekIso so we do
       not rely on module state that may reflect a different phase. */
    var iso = weeks[weekIdx];
    if(iso && personId && m._rowId){
      var all = _pndLoadHuddles();
      var key = personId + '__' + iso;
      var rec = all[key] || { answers:{}, away:false, conv:{doing:'',support:''}, goals:[], discuss:[], savedAt:null };
      _pndStampLockEdit(rec, personId, iso);
      rec.answers = rec.answers || {};
      if(next===null){ delete rec.answers[m._rowId]; }
      else { rec.answers[m._rowId] = (next==='Yes') ? 'yes' : 'no'; }
      rec.savedAt = new Date().toISOString();
      all[key] = rec;
      _pndSaveHuddles(all);
      try{ emitPndSignals(); }catch(e){}
      try{ window.dispatchEvent(new CustomEvent('bos.performance.changed',{detail:{personId:personId, kind:'weeklyHuddle'}})); }catch(e){}
    }
    renderPage();
  };
}

/* Called by renderRotatingHuddle after each phase's renderScorecardPND to
   snapshot module state before the next render overwrites it. */
function _pndSnapshotPhaseState(phase){
  if(!scorecard || !scorecard[0]) return;
  _pndPhaseState[phase] = {
    phase: phase,
    scorecard: scorecard[0],
    weeks: _pndScWeekIsos.slice(),
    personId: _pndScReportId
  };

/* Hard Fail Rules banner (below the grid).
   The per-week Weekly Score row lives at the bottom of the VSP grid itself
   (surgical patch in the port). This banner explains WHY the current week
   is 0% when a priority rule is not met. Item numbering follows the ORIGINAL
   std order so #1 / #2 stay stable after drag reorder. */
function _pndRenderWeeklyScoreSummary(std){
  var curIdx = scorecard[0].metrics[0].readings.length - 1;   // current week = last index

  var readingByRowId = {};
  scorecard[0].metrics.forEach(function(m){
    readingByRowId[m._rowId] = m.readings[curIdx];
  });
  function isYesVal(v){
    if(v==null) return false;
    var s = String(v).trim().toLowerCase();
    return (s==='yes'||s==='y'||s==='true'||s==='1');
  }

  var yes = 0, hardFailed = [];
  std.forEach(function(row){
    if(isYesVal(readingByRowId[row.id])) yes++;
    else if(row.hard) hardFailed.push(row);
  });
  var total = std.length;
  var rawPct = total ? Math.round(yes/total*100) : 0;
  var hardFail = hardFailed.length > 0;

  var h = '';
  h += '<div class="card" style="padding:14px 18px;margin-top:16px;margin-bottom:16px">';
  if(hardFail){
    h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="font-size:var(--fz-lg);font-weight:700;color:#dc2626">Hard Fail Rules</span><span style="display:inline-block;background:#dc2626;color:#fff;border-radius:4px;padding:3px 10px;font-size:var(--fz-sm);font-weight:700;text-transform:uppercase;letter-spacing:.04em">Fail triggered</span></div>';
    h += '<div style="font-style:italic;color:var(--txm);font-size:var(--fz-body);margin-bottom:8px">Any Priority Rule = No forces the week to 0% regardless of the other rows. Raw Yes-rate this week would have been '+rawPct+'%.</div>';
  } else {
    h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="font-size:var(--fz-lg);font-weight:700;color:var(--txt)">Hard Fail Rules</span></div>';
    h += '<div style="font-style:italic;color:var(--txm);font-size:var(--fz-body);margin-bottom:8px">Any Priority Rule = No forces the week to 0% regardless of the other rows.</div>';
  }
  var hardIdx = 0;
  std.forEach(function(row){
    if(!row.hard) return;
    hardIdx++;
    var isYes = isYesVal(readingByRowId[row.id]);
    var color = isYes ? '#16a34a' : '#dc2626';
    var mark = isYes ? '&#10003;' : '&#10007;';
    h += '<div style="color:'+color+';font-size:var(--fz-body);font-weight:600;margin-top:4px">Item #'+hardIdx+' (Priority Rule) = '+(isYes?'YES':'NO')+' <span style="margin-left:4px">'+mark+'</span></div>';
  });
  h += '</div>';
  return h;
}

        set:function(k,v){ return origSet(k,v); },
        snapshot:localSnapshot, sig:sigOf, push:pushUp, pull:pull,
        setReady:function(){ ready=true; lastSyncedSig=sigOf(localSnapshot()); }
      };
    }
  }catch(e){}
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
